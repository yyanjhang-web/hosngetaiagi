<meta charset="UTF-8">

<title>我的遊戲與工具啟動器</title>
<style>
  body {
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    background-color: #f3f3f3;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
  }
  .container {
    background: white;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    text-align: center;
    max-width: 900px;
    width: 90%;
  }
  h1 {
    margin-top: 0;
    margin-bottom: 30px;
    color: #333;
  }
  .button-grid {
    display: grid;
    /* 調整為 3 欄式排版 */
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }
  a.btn {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    background-color: #0078d4;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-size: 18px;
    font-weight: bold;
    transition: background-color 0.2s, transform 0.1s;
    text-align: center;
  }
  a.btn:hover {
    background-color: #005a9e;
  }
  a.btn:active {
    transform: scale(0.98);
  }
  
  /* 在小螢幕時自動調整為 2 欄或 1 欄 */
  @media (max-width: 768px) {
    .button-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }
  @media (max-width: 480px) {
    .button-grid {
