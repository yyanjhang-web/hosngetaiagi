<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <title>台語互動派題系統 - 學生端</title>
  <!-- 引入豆腐黑體 (Tauhu-Oo) 官方字型，完美支援台羅聲調與罕用字 -->
  <link href="https://tauhu.tw/tauhu-oo.css" rel="stylesheet">
  <link href="https://tauhu.tw/tauhu-oo-bold.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
    
    :root { 
        --primary: #5c7c99; --student: #f8fafc; --danger: #ef4444; --success: #22c55e; --accent: #93c5fd; 
        --text-dark: #334155; --text-light: #94a3b8;
        /* 選項色塊：沿用莫蘭迪的低飽和度，但加深明度，讓白字對比度 ≥ 4.5:1（教師端須同步） */
        --c-red: #b0524f;   /* 磚紅 */
        --c-blue: #4a78a0;  /* 灰藍 */
        --c-yellow: #926d10;/* 赭黃 */
        --c-green: #517d51; /* 苔綠 */
        /* 底邊界顏色 */
        --c-red-b: #8a3a38;
        --c-blue-b: #345a7e;
        --c-yellow-b: #6f5209;
        --c-green-b: #3b5e3b;
        --main-font: 'Tauhu-oo', 'Noto Sans TC', sans-serif;
    }
    
    body { font-family: var(--main-font); margin: 0; padding: 20px; background: #f1f5f9; color: var(--text-dark); min-height: 100vh; position: relative; padding-bottom: 155px; box-sizing: border-box;}
    .hidden { display: none !important; }
    button { cursor: pointer; border-radius: 12px; border: none; font-weight: bold; transition: all 0.2s ease; font-family: var(--main-font); box-shadow: 0 4px 6px rgba(0,0,0,0.1);}
    button:active { transform: translateY(2px); box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
    
    .version-tag { position: absolute; top: 10px; right: 10px; background: var(--text-light); color: white; padding: 4px 10px; border-radius: 12px; font-size: 12px; }
    .footer { position: absolute; bottom: 44px; left: 0; width: 100%; text-align: center; color: var(--text-light); font-size: 12px; line-height: 1.35; }
    .footer p { margin: 2px 0; }

    /* 學生作答時畫面下緣固定警示橫幅 */
    .exam-warning-banner { position: fixed; bottom: 0; left: 0; width: 100%; background: #334155; color: #fef08a; text-align: center; padding: 8px 12px; font-size: 15px; font-weight: bold; letter-spacing: 1px; z-index: 9500; box-shadow: 0 -2px 8px rgba(0,0,0,0.12); box-sizing: border-box; }
    
    #lobby { max-width: 600px; margin: 50px auto; text-align: center; background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    .role-btn { padding: 14px 28px; font-size: 18px; margin: 10px auto; background: var(--primary); color: white; width: 85%; display: block;}
    
    .input-group { margin-bottom: 20px; text-align: left; width: 85%; margin-left: auto; margin-right: auto; }
    .input-group label { display: block; font-size: 14px; color: var(--text-dark); margin-bottom: 8px; font-weight: bold;}
    input[type="text"] { padding: 12px 15px; font-size: 16px; border: 2px solid #e2e8f0; border-radius: 12px; font-family: var(--main-font); width: 100%; box-sizing: border-box; text-align:center; transition: border-color 0.3s ease;}
    input[type="text"]:focus { outline: none; border-color: var(--accent); }
    input:disabled { background-color: #f8fafc; cursor: not-allowed; color: var(--text-light); font-weight: bold; border-color: #f1f5f9;}

    #studentView { max-width: 800px; margin: 0 auto; text-align: center; background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); min-height: 60vh; display: flex; flex-direction: column; justify-content: center; position: relative;}
    
    /* 學生平板右上角資訊列：精準三行排版 */
    .student-info-bar { position: absolute; top: 15px; right: 20px; text-align: right; line-height: 1.4; display: flex; flex-direction: column; align-items: flex-end;}
    .info-line-1 { font-size: 13px; color: var(--text-light); font-weight: bold; }
    .info-line-2 { font-size: 16px; font-weight: bold; color: var(--primary); margin: 2px 0;}
    .info-line-3 { font-size: 13px; color: var(--text-dark); font-weight: bold;}

    #studentQuestion { font-size: 26px; font-weight: bold; margin-bottom: 18px; color: var(--primary); line-height: 1.5; margin-top: 40px;}
    #myAnswerDisplay { margin-bottom: 20px; font-size: 18px; font-weight: bold; color: var(--primary); min-height: 30px; padding: 10px; border-radius: 8px; background: #f8fafc;}

    /* 【等待嘛是一種學習】輪播知識卡片 */
    #waitingLearnBox { margin: 8px auto 10px; max-width: 640px; width: 100%; background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 16px; padding: 20px 24px 18px; text-align: left; box-shadow: 0 4px 12px rgba(92,124,153,0.08); box-sizing: border-box; position: relative; overflow: hidden; animation: fadeInCard 0.4s ease;}
    @keyframes fadeInCard { from { opacity: 0.4; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .learn-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; border-bottom: 1px dashed #cbd5e1; padding-bottom: 10px;}
    .learn-badge { background: var(--primary); color: white; font-size: 14px; font-weight: bold; padding: 4px 12px; border-radius: 20px; letter-spacing: 0.5px;}
    .learn-category { font-size: 13px; font-weight: bold; color: #475569; background: #e2e8f0; padding: 3px 10px; border-radius: 12px;}
    .learn-person-name { font-size: 22px; font-weight: bold; color: var(--primary); margin: 4px 0 10px; line-height: 1.3;}
    .learn-person-desc { font-size: 17px; color: var(--text-dark); line-height: 1.7; margin: 0 0 14px; text-align: justify;}
    .learn-progress-bg { width: 100%; height: 6px; background: #e2e8f0; border-radius: 3px; overflow: hidden; }
    .learn-progress-fill { height: 100%; width: 100%; background: var(--accent); border-radius: 3px; }
    
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 100%; margin-bottom: 25px;}
    .option-btn { padding: 25px 15px; font-size: 22px; color: white; display: flex; align-items: center; justify-content: center; text-align: center; }
    .option-btn span.shape { font-size: 32px; margin-right: 15px; width: 35px; text-align: center; color: white;}
    .option-btn span.text { text-shadow: 1px 1px 2px rgba(0,0,0,0.3);}
    
    .opt-0 { background-color: var(--c-red); border-bottom: 5px solid var(--c-red-b); }
    .opt-1 { background-color: var(--c-blue); border-bottom: 5px solid var(--c-blue-b); }
    .opt-2 { background-color: var(--c-yellow); border-bottom: 5px solid var(--c-yellow-b); }
    .opt-3 { background-color: var(--c-green); border-bottom: 5px solid var(--c-green-b); }
    
    .option-btn.selected { opacity: 1 !important; transform: scale(1.02); box-shadow: 0 0 15px rgba(0,0,0,0.2); border-bottom-width: 2px; margin-top: 3px;}
    .option-btn.dimmed { opacity: 0.4 !important; filter: grayscale(50%); cursor: not-allowed; }
    .option-btn.reveal-correct { opacity: 1 !important; outline: 6px solid #4ade80; outline-offset: 2px;}
    .option-btn.reveal-wrong { opacity: 0.3 !important; filter: grayscale(100%); }

    .nav-btn { padding: 10px 20px; font-size: 16px; background: var(--text-light); color: white; }
    .nav-btn:hover { background: #64748b; }
    .nav-btn:disabled { background: #e2e8f0; color: #94a3b8; cursor: not-allowed; }
    
    /* 全員黑屏遮罩：純黑底色與中央白字提醒 */
    #blackoutOverlay { position: fixed; inset: 0; width: 100%; height: 100%; background: #000000; color: #ffffff; z-index: 9800; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; box-sizing: border-box; user-select: none; }
    .blackout-text { font-size: clamp(28px, 5vw, 44px); font-weight: bold; letter-spacing: 3px; line-height: 1.5; color: #ffffff; }

    #offlineOverlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(255,255,255,0.95); color: var(--primary); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align:center;}
  </style>
</head>
<body>
  <div class="version-tag">Ver 2.31 (Student)</div>
  
  <div id="lobby">
    <h1 style="color:var(--primary); margin-bottom: 5px;">台語互動派題系統</h1>
    <h3 style="color:var(--text-light); margin-top: 0; margin-bottom: 30px;">考生報到</h3>
    
    <!-- 第 1 行：試場編號 -->
    <div class="input-group">
        <label>試場編號</label>
        <input type="text" id="pinInput" placeholder="輸入 4 碼編號">
    </div>
    <!-- 第 2 行：僅保留班級 -->
    <div class="input-group">
        <label>班級</label>
        <input type="text" id="classInput" placeholder="例如：701">
    </div>
    <!-- 第 3 行：座號1 與 座號2 -->
    <div class="input-group" style="display: flex; gap: 15px;">
        <div style="flex: 1;">
            <label>座號1</label>
            <input type="text" id="seatInput1" placeholder="第1位的座號">
        </div>
        <div style="flex: 1;">
            <label>座號2</label>
            <input type="text" id="seatInput2" placeholder="無則免填">
        </div>
    </div>
    <!-- 第 4 行：姓名1 與 姓名2 -->
    <div class="input-group" style="display: flex; gap: 15px;">
        <div style="flex: 1;">
            <label>姓名1</label>
            <input type="text" id="realNameInput1" placeholder="第1位的姓名">
        </div>
        <div style="flex: 1;">
            <label>姓名2</label>
            <input type="text" id="realNameInput2" placeholder="無則免填">
        </div>
    </div>
    <!-- 第 5 行：平板編號 -->
    <div class="input-group">
        <label>平板編號</label>
        <input type="text" id="deviceInput" placeholder="例如：A15">
    </div>

    <button class="role-btn" onclick="joinAsStudent()" style="margin-top:30px; background:var(--accent); color:#0f172a;">進入教室</button>
  </div>

  <div id="studentView" class="hidden">
    <div class="student-info-bar">
      <div class="info-line-1" id="sPinDisplay">編號：----</div>
      <div class="info-line-2" id="sNickname"></div>
      <div class="info-line-3" id="sRealName"></div>
    </div>
    
    <div id="studentMainContent">
        <div id="studentQuestion">等待老師開始...</div>

        <!-- 等待老師開始時：15 秒不重複隨機輪播臺灣語言與文學先賢介紹 -->
        <div id="waitingLearnBox" class="hidden">
          <div class="learn-header-row">
            <span class="learn-badge">🌱 等待嘛是一種學習</span>
            <span class="learn-category" id="learnCategory"></span>
          </div>
          <div class="learn-person-name" id="learnName"></div>
          <p class="learn-person-desc" id="learnDesc"></p>
          <div class="learn-progress-bg">
            <div class="learn-progress-fill" id="learnProgressBar"></div>
          </div>
        </div>

        <div id="myAnswerDisplay" class="hidden"></div>
        <div id="optionsContainer" class="options-grid hidden"></div>
        <div id="testNav" class="hidden" style="display: flex; justify-content: space-between; margin-top: 20px; align-items: center;">
          <button class="nav-btn" onclick="navTest(-1)">上一題</button>
          <span id="testProgress" style="font-size: 16px; font-weight: bold; color:var(--primary);"></span>
          <button id="nextOrSubmitBtn" class="nav-btn" onclick="navTest(1)">下一題</button>
        </div>
    </div>
    <audio id="studentAudio"></audio>
  </div>

  <!-- 學生作答時固定於畫面下緣的提醒橫幅 -->
  <div id="examWarningBanner" class="exam-warning-banner hidden">
    未經指示請勿重新整理，亦不要關閉視窗
  </div>

  <!-- 教師開啟「全員黑屏」時的全黑畫面 -->
  <div id="blackoutOverlay" class="hidden">
    <div class="blackout-text">保持安靜，聽教師指示</div>
  </div>

  <div id="offlineOverlay" class="hidden">
    <h1 style="font-size:40px; color:var(--danger); margin-bottom:10px;">臨時中止</h1>
    <p style="font-size:18px;">老師大屏已離線，請等待重新連線...</p>
  </div>

  <div class="footer">
    <p>設計者：Iônn, Àn-tsiong | 技術支援：Gemini</p>
    <p>BGM取自:甘茶の工房</p>
    <p>Copyright &copy; 2025-2026 Iônn, Àn-tsiong. All Rights Reserved.<br>未經授權，嚴禁重製、改作或商用。</p>
  </div>

        document.getElementById('pinInput').value = pinFromUrl;

    // === 【線上測驗】每個學生專屬的確定性隨機洗牌 ===
    function createSeededRandom(seedStr) {
        let h = 2166136261 >>> 0;
        for (let i = 0; i < seedStr.length; i++) {
            h = Math.imul(h ^ seedStr.charCodeAt(i), 16777619);
        }
        let a = h >>> 0;
        return function() {
            let t = a += 0x6D2B79F5;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }

    function seededShuffle(arr, seedStr) {
        const copy = [...arr];
        const rand = createSeededRandom(seedStr);
        for (let i = copy.length - 1; i > 0; i--) {
            const j = Math.floor(rand() * (i + 1));
            [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
    }

    let rawTestPaper = [];
    let selectedQuestions = [];
    let builtPaperKey = '';
    let myStudentId = null, roomMode = 'kahoot'; 
    let currentSettings = { 
        pin: '', showQuestion: true, status: 'waiting', audioSource: 'teacher', 
        acceptAnswers: false, roundId: 0, blackout: false,
        diffQOrder: false, diffOptOrder: false
    };
    let myTestAnswers = {}, hasSubmittedTest = false, myTestIndex = 0;
    let testPaperRendered = false;
    let testReviewStarted = false;
    let kahootReviewStarted = false;
    let lastRoundId = 0;
    let latestKahootQ = null;
    let lastRenderedKahootIndex = -1;
    let localQStartTime = 0;
    let offlineDebounceTimer = null; // 5秒防抖緩衝，避免網路瞬間閃斷立刻鎖死學生畫面

    function buildStudentPaper(rawPaper) {
        if (!rawPaper || rawPaper.length === 0) {
            selectedQuestions = [];
            return;
        }
        const seedBase = `${myStudentId || 'stu'}_${currentSettings.roundId || 0}`;
        let paper = rawPaper.map((q, idx) => {
            const origIdx = q.origIdx !== undefined ? q.origIdx : idx;
            let opts = [...(q.options || [])];
            if (roomMode === 'test' && currentSettings.diffOptOrder) {
                opts = seededShuffle(opts, `${seedBase}_opt_${origIdx}`);
            }
            return {
                ...q,
                origIdx: origIdx,
                options: opts
            };
        });
        if (roomMode === 'test' && currentSettings.diffQOrder) {
            paper = seededShuffle(paper, `${seedBase}_q`);
        }
        selectedQuestions = paper;
        builtPaperKey = `${currentSettings.roundId}_${roomMode}_${!!currentSettings.diffQOrder}_${!!currentSettings.diffOptOrder}_${rawPaper.length}`;
    }

    function ensureStudentPaperBuilt() {
        if (!rawTestPaper || rawTestPaper.length === 0) return;
        const targetKey = `${currentSettings.roundId}_${roomMode}_${!!currentSettings.diffQOrder}_${!!currentSettings.diffOptOrder}_${rawTestPaper.length}`;
        if (builtPaperKey !== targetKey || selectedQuestions.length === 0) {
            buildStudentPaper(rawTestPaper);
        }
    }

    function resetRoundState() {
        hasSubmittedTest = false;
        myTestAnswers = {};
        myTestIndex = 0;
        testPaperRendered = false;
        testReviewStarted = false;
        kahootReviewStarted = false;
        lastRenderedKahootIndex = -1;
        builtPaperKey = '';
    }

    function tryRenderKahootQuestion() {
        if(roomMode !== 'kahoot' || currentSettings.status !== 'kahoot_active') return;
        const qObj = (currentSettings.currentQ && currentSettings.currentQ.kahootIndex === currentSettings.kahootIndex)
            ? currentSettings.currentQ
            : latestKahootQ;
        if(!qObj) return;

        const qIdx = qObj.kahootIndex !== undefined ? qObj.kahootIndex : currentSettings.kahootIndex;
        if(qIdx !== currentSettings.kahootIndex) return;

        stopWaitingCarousel();
        document.getElementById('testNav').classList.add('hidden');
        if(lastRenderedKahootIndex !== qIdx) {
            lastRenderedKahootIndex = qIdx;
            localQStartTime = Date.now();
            renderStudentQuestion(qObj);
        } else {
            document.getElementById('studentQuestion').innerText = currentSettings.showQuestion ? (qObj.question || qObj.q) : "請看大屏題目作答";
        }
    }

    function tryStartTestPaper() {
        if(roomMode !== 'test' || currentSettings.status !== 'testing' || hasSubmittedTest) return;
        if(!rawTestPaper || rawTestPaper.length === 0) return;

        ensureStudentPaperBuilt();
        if(!selectedQuestions || selectedQuestions.length === 0) return;

        stopWaitingCarousel();
        if(!testPaperRendered) {
            testPaperRendered = true;
            myTestIndex = 0;
            document.getElementById('studentMainContent').classList.remove('hidden');
            document.getElementById('optionsContainer').classList.remove('hidden');
            document.getElementById('testNav').classList.remove('hidden');
            renderTestQuestion();
        } else {
            const qData = selectedQuestions[myTestIndex];
            if(qData) {
                document.getElementById('studentQuestion').innerText = currentSettings.showQuestion ? (qData.question || qData.q) : "請看大屏題目作答";
            }
        }
    }

    async function handleTestModeSettings() {
      const s = currentSettings;
      if(s.status === 'waiting') { testReviewStarted = false; return; }

      if(s.status === 'testing' && s.acceptAnswers === false && !hasSubmittedTest) {
        stopWaitingCarousel();
        hasSubmittedTest = true;
        document.getElementById('studentQuestion').innerText = "測驗已收卷，系統已自動儲存你的作答，請看大屏聽老師講解。";
        document.getElementById('optionsContainer').classList.add('hidden');
        document.getElementById('myAnswerDisplay').innerText = "";
        document.getElementById('testNav').classList.add('hidden');
      }

      if(s.status === 'reviewing' && s.showAnswer && !testReviewStarted) {
        stopWaitingCarousel();
        testReviewStarted = true;
        hasSubmittedTest = true;
        try {
          if(!rawTestPaper || rawTestPaper.length === 0) {
            const paperSnap = await get(ref(db, 'room/testPaper'));
            if(paperSnap.exists()) rawTestPaper = paperSnap.val();
          }
          ensureStudentPaperBuilt();
          const mySnap = await get(ref(db, `room/testAnswers/${myStudentId}`));
          const mine = mySnap.val() || {};
          Object.keys(mine).forEach(k => { if(mine[k] && mine[k].answer !== undefined) myTestAnswers[k] = String(mine[k].answer).trim(); });
        } catch(e) { console.error(e); }
        if(!selectedQuestions || selectedQuestions.length === 0) { testReviewStarted = false; return; }
        myTestIndex = 0;
        document.getElementById('studentMainContent').classList.remove('hidden');
        document.getElementById('optionsContainer').classList.remove('hidden');
        document.getElementById('testNav').classList.remove('hidden');
        renderTestQuestion();
      }
    }

    async function handleKahootModeSettings() {
      const s = currentSettings;
      if(s.status === 'waiting' || s.status === 'kahoot_active' || s.status === 'ended') { kahootReviewStarted = false; }
      if(s.status === 'reviewing' && s.showAnswer && !kahootReviewStarted) {
        stopWaitingCarousel();
        kahootReviewStarted = true;
        try {
          const paperSnap = await get(ref(db, 'room/testPaper'));
          if(paperSnap.exists()) {
              rawTestPaper = paperSnap.val();
              buildStudentPaper(rawTestPaper);
          }
          const mySnap = await get(ref(db, `room/testAnswers/${myStudentId}`));
          const mine = mySnap.val() || {};
          Object.keys(mine).forEach(k => { if(mine[k] && mine[k].answer !== undefined) myTestAnswers[k] = String(mine[k].answer).trim(); });
        } catch(e) { console.error(e); }
        if(!selectedQuestions || selectedQuestions.length === 0) { kahootReviewStarted = false; return; }
        myTestIndex = 0;
        document.getElementById('studentMainContent').classList.remove('hidden');
        document.getElementById('optionsContainer').classList.remove('hidden');
        document.getElementById('testNav').classList.remove('hidden');
        renderTestQuestion();
      }
    }

    function listenToRoom() {
      // 監聽教師設備在線狀態：加入 5 秒防抖緩衝，防止 Wi-Fi 瞬斷誤鎖學生畫面
      onValue(ref(db, 'room/teachers'), snap => {
         const teachers = snap.val() || {};
         const anyOnline = Object.keys(teachers).length > 0;
         if (anyOnline) {
             if (offlineDebounceTimer) { clearTimeout(offlineDebounceTimer); offlineDebounceTimer = null; }
             document.getElementById('offlineOverlay').classList.add('hidden');
         } else {
             if (!offlineDebounceTimer) {
                 offlineDebounceTimer = setTimeout(() => {
                     document.getElementById('offlineOverlay').classList.remove('hidden');
                 }, 5000);
             }
         }
      });

      onValue(ref(db, 'room/settings'), snap => {
        if(snap.exists()) {
          const newSettings = snap.val();
          if(newSettings.roundId && newSettings.roundId !== lastRoundId) {
              lastRoundId = newSettings.roundId;
              resetRoundState();
          }
          currentSettings = newSettings;
          roomMode = currentSettings.mode || 'kahoot';
          if(newSettings.currentQ) {
              latestKahootQ = newSettings.currentQ;
          }

          const blackoutEl = document.getElementById('blackoutOverlay');
          const stuAud = document.getElementById('studentAudio');
          if(currentSettings.blackout) {
              blackoutEl.classList.remove('hidden');
              if(stuAud) stuAud.volume = 0;
          } else {
              blackoutEl.classList.add('hidden');
              if(stuAud) stuAud.volume = 1;
          }
          
          if(currentSettings.status === 'waiting') {
            document.getElementById('studentQuestion').innerText = "等待老師開始...";
            document.getElementById('optionsContainer').classList.add('hidden');
            document.getElementById('myAnswerDisplay').innerText = "";
            document.getElementById('testNav').classList.add('hidden');
            document.getElementById('studentMainContent').classList.remove('hidden');
            resetRoundState();
            startWaitingCarousel();
          } else {
            stopWaitingCarousel();
          }
          
          if(currentSettings.status === 'ended' && !currentSettings.showAnswer) {
             document.getElementById('studentQuestion').innerText = "測驗已結束，請看大屏聽老師講解。";
             document.getElementById('optionsContainer').classList.add('hidden');
             document.getElementById('myAnswerDisplay').innerText = "";
             document.getElementById('testNav').classList.add('hidden');
          }

          if(roomMode === 'kahoot') {
             tryRenderKahootQuestion();
             handleKahootModeSettings();
          }

          if(roomMode === 'test') {
             tryStartTestPaper();
             handleTestModeSettings();
          }
          updateStudentUI();
        }
      });

      onValue(ref(db, 'room/currentKahootQ'), snap => {
        if(snap.exists()) {
            latestKahootQ = snap.val();
            tryRenderKahootQuestion();
        }
      });

      onValue(ref(db, 'room/testPaper'), snap => {
        if(snap.exists()) {
          rawTestPaper = snap.val();
          buildStudentPaper(rawTestPaper);
          
          if(roomMode === 'test' && currentSettings.status === 'testing' && !hasSubmittedTest) {
              stopWaitingCarousel();
              testPaperRendered = true;
              myTestIndex = 0;
              document.getElementById('studentMainContent').classList.remove('hidden');
              document.getElementById('optionsContainer').classList.remove('hidden');
              document.getElementById('testNav').classList.remove('hidden');
              renderTestQuestion();
          }
          
          if(currentSettings.status === 'reviewing' && currentSettings.showAnswer) {
              stopWaitingCarousel();
              if(myTestIndex >= selectedQuestions.length) myTestIndex = 0;
              document.getElementById('studentMainContent').classList.remove('hidden');
              document.getElementById('optionsContainer').classList.remove('hidden');
              document.getElementById('testNav').classList.remove('hidden');
              renderTestQuestion(); 
          }
        }
      });
    }

    function renderStudentQuestion(qData) {
      if(hasSubmittedTest && !currentSettings.showAnswer && currentSettings.status !== 'reviewing') return;
      
      if(currentSettings.status === 'reviewing') {
          document.getElementById('studentQuestion').innerText = qData.question || qData.q;
      } else {
          document.getElementById('studentQuestion').innerText = currentSettings.showQuestion ? (qData.question || qData.q) : "請看大屏題目作答";
      }
      
      document.getElementById('myAnswerDisplay').innerText = ""; 
      
      const optC = document.getElementById('optionsContainer');
      optC.innerHTML = ''; 
      
      if (qData.options && qData.options.length > 0) {
          optC.classList.remove('hidden');
          qData.options.forEach((opt, idx) => {
            const optStr = String(opt).trim();
            const btn = document.createElement('button');
            btn.className = `option-btn opt-${idx % 4}`;
            btn.dataset.opt = optStr;
            
            if (roomMode === 'kahoot') {
                btn.innerHTML = `<span class="shape">${shapes[idx % 4]}</span><span class="text">${optStr}</span>`;
            } else {
                btn.innerHTML = `<span class="text">${optStr}</span>`;
            }
            
            btn.onclick = () => {
                if(!currentSettings.acceptAnswers) return;
                document.querySelectorAll('.option-btn').forEach(b => {
                    b.classList.remove('selected');
                    b.classList.add('dimmed');
                });
                btn.classList.remove('dimmed');
                btn.classList.add('selected');
                submitAnswer(optStr, btn, qData.questionId);
            };
            optC.appendChild(btn);
          });
      } else {
          optC.classList.add('hidden');
      }

      if(qData.audio && currentSettings.audioSource === 'student') {
          const stuAud = document.getElementById('studentAudio');
          stuAud.volume = currentSettings.blackout ? 0 : 1;
          stuAud.src = qData.audio;
          stuAud.play().catch(e=>{});
      }
      updateStudentUI();
    }

    function submitAnswer(selectedOpt, btnElement, qId) {
      if(!currentSettings.acceptAnswers) return;
      const optStr = String(selectedOpt).trim();
      
      if(roomMode === 'kahoot') {
        myTestAnswers[currentSettings.kahootIndex] = optStr;
        const elapsed = Math.max(0, Date.now() - (localQStartTime || Date.now()));
        set(ref(db, `room/kahootAnswers/${myStudentId}`), { answer: optStr, time: elapsed });
        set(ref(db, `room/testAnswers/${myStudentId}/${currentSettings.kahootIndex}`), { answer: optStr });
        
        document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
        const praises = ["手腳誠猛喔！", "水啦！", "讚喔！", "繼續保持！", "等待結算中...", "好勢好勢！", "真有氣勢！"];
        document.getElementById('myAnswerDisplay').innerHTML = `<span style="color:var(--text-light);">${praises[Math.floor(Math.random()*praises.length)]}</span>`;
      } else {
        const qData = selectedQuestions[myTestIndex];
        const origIdx = (qData && qData.origIdx !== undefined) ? qData.origIdx : myTestIndex;
        myTestAnswers[origIdx] = optStr;
        document.getElementById('myAnswerDisplay').innerHTML = `已選擇：<span style="color:var(--primary);">${optStr}</span>`;
        set(ref(db, `room/testAnswers/${myStudentId}/${origIdx}`), { answer: optStr });
      }
    }

    window.navTest = (dir) => {
      if(currentSettings.status !== 'reviewing') {
          if(hasSubmittedTest && !currentSettings.showAnswer) return; 
      }
      
      if(dir === 1 && myTestIndex === selectedQuestions.length - 1 && !hasSubmittedTest && currentSettings.status === 'testing') {
          if(confirm("交卷後不得修改答案，確定交卷？")) {
            hasSubmittedTest = true;
            set(ref(db, `room/testAnswers/${myStudentId}/isSubmitted`), true);
            document.getElementById('studentQuestion').innerText = "請靜待所有考生作答完畢，勿關閉此畫面。";
            document.getElementById('optionsContainer').classList.add('hidden');
            document.getElementById('myAnswerDisplay').innerText = "";
            document.getElementById('testNav').classList.add('hidden');
          }
          return;
      }
      myTestIndex += dir;
      if(myTestIndex < 0) myTestIndex = 0;
      if(myTestIndex > selectedQuestions.length - 1) myTestIndex = selectedQuestions.length - 1;
      renderTestQuestion();
    };

    function renderTestQuestion() {
      if(selectedQuestions.length === 0) return;
      const qData = selectedQuestions[myTestIndex];
      const origIdx = (qData && qData.origIdx !== undefined) ? qData.origIdx : myTestIndex;
      document.getElementById('testProgress').innerText = `${myTestIndex + 1} / ${selectedQuestions.length}`;
      const nBtn = document.getElementById('nextOrSubmitBtn');
      
      if(currentSettings.status === 'reviewing') {
          if(myTestIndex === selectedQuestions.length - 1) { 
              nBtn.innerText = "已到最後一題"; 
              nBtn.style.background = "#e2e8f0"; 
              nBtn.style.color = "#94a3b8"; 
              nBtn.disabled = true; 
          } else { 
              nBtn.innerText = "下一題"; 
              nBtn.style.background = "var(--text-light)"; 
              nBtn.style.color = "white"; 
              nBtn.disabled = false; 
          }
      } else if(myTestIndex === selectedQuestions.length - 1 && !hasSubmittedTest && currentSettings.status === 'testing') { 
          nBtn.innerText = "交卷"; 
          nBtn.style.background = "var(--danger)"; 
          nBtn.style.color = "white"; 
          nBtn.disabled = false;
      } else { 
          nBtn.innerText = "下一題"; 
          nBtn.style.background = "var(--text-light)"; 
          nBtn.style.color = "white"; 
          nBtn.disabled = false;
      }

      renderStudentQuestion(qData);
      
      if(myTestAnswers[origIdx] !== undefined && currentSettings.status !== 'reviewing') {
        const myAnsStr = String(myTestAnswers[origIdx]).trim();
        document.getElementById('myAnswerDisplay').innerHTML = `已選擇：<span style="color:var(--primary);">${myAnsStr}</span>`;
        document.querySelectorAll('.option-btn').forEach(b => {
          const optText = b.dataset.opt;
          if(optText !== myAnsStr) { b.classList.add('dimmed'); }
          else { b.classList.add('selected'); }
        });
      }

      if(currentSettings.showAnswer && currentSettings.status === 'reviewing') {
          const cAns = String(qData.correctAnswer ?? '').trim();
          const myAnsStr = myTestAnswers[origIdx] !== undefined ? String(myTestAnswers[origIdx]).trim() : null;
          let isCorrect = false;
          
          document.querySelectorAll('.option-btn').forEach(b => {
             b.disabled = true; 
             const optText = b.dataset.opt;
             
             if(optText === cAns) {
                 b.classList.add('reveal-correct');
                 if(myAnsStr === cAns) isCorrect = true;
             } else if (optText === myAnsStr) {
                 b.classList.add('reveal-wrong');
             } else {
                 b.classList.add('dimmed');
             }
          });
          
          const ansText = myAnsStr !== null ? myAnsStr : "未作答";
          document.getElementById('myAnswerDisplay').innerHTML = isCorrect ? `<span style="color:var(--success);">🟢 答對了！</span> 您的答案：${ansText}` : `<span style="color:var(--danger);">🔴 答錯了！</span> 您的答案：${ansText}`;
      }
    }

    function updateStudentUI() {
      if (!currentSettings.acceptAnswers && currentSettings.status === 'kahoot_active') {
        document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
      }
      
      if (currentSettings.status === 'reviewing' && currentSettings.showAnswer) {
          document.getElementById('studentMainContent').classList.remove('hidden');
          document.getElementById('optionsContainer').classList.remove('hidden');
          document.getElementById('testNav').classList.remove('hidden'); 
          
          if (document.getElementById('optionsContainer').innerHTML === '') {
             renderTestQuestion();
          }
      }
      
      if(currentSettings.status === 'kahoot_result' && roomMode === 'kahoot') {
          const myAns = myTestAnswers[currentSettings.kahootIndex] !== undefined ? String(myTestAnswers[currentSettings.kahootIndex]).trim() : null;
          const correctStr = String(currentSettings.currentCorrect ?? '').trim();
          const isCorrect = (myAns !== null) && (myAns === correctStr);
          document.getElementById('myAnswerDisplay').innerHTML = myAns !== null
              ? (isCorrect ? `<span style="color:var(--success);">🟢 答對了！</span>` : `<span style="color:var(--danger);">🔴 答錯了！</span>`)
              : `<span style="color:var(--text-light);">⏰ 時間到，未作答</span>`;

          document.querySelectorAll('.option-btn').forEach(b => {
             b.disabled = true;
             const optText = b.dataset.opt;
             if(optText === correctStr) b.classList.add('reveal-correct');
             else b.classList.add('reveal-wrong'); 
          });
      }
    }
  </script>
</body>
</html>
