<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台語互動派題系統 - 學生端</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
    
    :root { 
        --primary: #5c7c99; --student: #f8fafc; --danger: #fca5a5; --success: #86efac; --accent: #93c5fd; 
        --text-dark: #334155; --text-light: #94a3b8;
        /* Kahoot 經典四色 */
        --c-red: #e21b3c; --c-blue: #1368ce; --c-yellow: #d89e00; --c-green: #26890c;
    }
    
    body { font-family: 'Noto Sans TC', sans-serif; margin: 0; padding: 20px; background: #f1f5f9; color: var(--text-dark); min-height: 100vh; position: relative; padding-bottom: 120px;}
    .hidden { display: none !important; }
    button { cursor: pointer; border-radius: 12px; border: none; font-weight: bold; transition: all 0.2s ease; font-family: 'Noto Sans TC', sans-serif; box-shadow: 0 4px 6px rgba(0,0,0,0.1);}
    button:active { transform: translateY(2px); box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
    
    .version-tag { position: absolute; top: 10px; right: 10px; background: var(--text-light); color: white; padding: 4px 10px; border-radius: 12px; font-size: 12px; }
    .footer { position: absolute; bottom: 10px; left: 0; width: 100%; text-align: center; color: var(--text-light); font-size: 12px; line-height: 1.4; }
    
    #lobby { max-width: 600px; margin: 50px auto; text-align: center; background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    .role-btn { padding: 14px 28px; font-size: 18px; margin: 10px auto; background: var(--primary); color: white; width: 85%; display: block;}
    
    .input-group { margin-bottom: 20px; text-align: left; width: 85%; margin-left: auto; margin-right: auto; }
    .input-group label { display: block; font-size: 14px; color: var(--text-dark); margin-bottom: 8px; font-weight: bold;}
    input[type="text"] { padding: 12px 15px; font-size: 16px; border: 2px solid #e2e8f0; border-radius: 12px; font-family: 'Noto Sans TC', sans-serif; width: 100%; box-sizing: border-box; text-align:center; transition: border-color 0.3s ease;}
    input[type="text"]:focus { outline: none; border-color: var(--accent); }
    input:disabled { background-color: #f8fafc; cursor: not-allowed; color: var(--text-light); font-weight: bold; border-color: #f1f5f9;}

    #studentView { max-width: 800px; margin: 0 auto; text-align: center; background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); min-height: 60vh; display: flex; flex-direction: column; justify-content: center; position: relative;}
    .student-info-bar { position: absolute; top: 20px; right: 25px; color: var(--text-light); font-size: 14px; text-align: right; }
    #studentQuestion { font-size: 26px; font-weight: bold; margin-bottom: 25px; color: var(--primary); line-height: 1.5; }
    #myAnswerDisplay { margin-bottom: 25px; font-size: 18px; font-weight: bold; color: var(--primary); min-height: 30px; padding: 10px; border-radius: 8px; background: #f8fafc;}
    
    /* 遊戲化選項按鈕設計 */
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 100%; margin-bottom: 25px;}
    .option-btn { padding: 25px 15px; font-size: 22px; color: white; display: flex; align-items: center; justify-content: center; text-align: center; }
    
    /* 花色圖形改為純白 */
    .option-btn span.shape { font-size: 32px; margin-right: 15px; width: 35px; text-align: center; color: white;}
    .option-btn span.text { text-shadow: 1px 1px 2px rgba(0,0,0,0.3);}
    
    .opt-0 { background-color: var(--c-red); border-bottom: 5px solid #a7142c; }
    .opt-1 { background-color: var(--c-blue); border-bottom: 5px solid #0e4c96; }
    .opt-2 { background-color: var(--c-yellow); border-bottom: 5px solid #a37700; }
    .opt-3 { background-color: var(--c-green); border-bottom: 5px solid #1a5c08; }
    
    .option-btn.selected { opacity: 1 !important; transform: scale(1.02); box-shadow: 0 0 15px rgba(0,0,0,0.2); border-bottom-width: 2px; margin-top: 3px;}
    .option-btn.dimmed { opacity: 0.4 !important; filter: grayscale(50%); cursor: not-allowed; }
    
    /* 檢討模式正確/錯誤特效 */
    .option-btn.reveal-correct { opacity: 1 !important; outline: 6px solid #4ade80; outline-offset: 2px;}
    .option-btn.reveal-wrong { opacity: 0.3 !important; filter: grayscale(100%); }

    .nav-btn { padding: 10px 20px; font-size: 16px; background: var(--text-light); color: white; }
    .nav-btn:hover { background: #64748b; }
    
    #offlineOverlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(255,255,255,0.95); color: var(--primary); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align:center;}
  </style>
</head>
<body>
  <div class="version-tag">Ver 2.9 (Student)</div>
  
  <div id="lobby">
    <h1 style="color:var(--primary); margin-bottom: 5px;">台語互動派題系統</h1>
    <h3 style="color:var(--text-light); margin-top: 0; margin-bottom: 30px;">考生報到</h3>
    
    <div class="input-group">
        <label>試場編號</label>
        <input type="text" id="pinInput" placeholder="輸入 4 碼編號">
    </div>
    <div class="input-group" style="display: flex; gap: 15px;">
        <div style="flex: 1;">
            <label>班級</label>
            <input type="text" id="classInput" placeholder="例如：701">
        </div>
        <div style="flex: 1;">
            <label>座號 <span style="font-size:11px; font-weight:normal; color:var(--text-light);">(個人或小組)</span></label>
            <input type="text" id="seatInput" placeholder="例如：12">
        </div>
    </div>
    <div class="input-group">
        <label>真實姓名</label>
        <input type="text" id="realNameInput" placeholder="輸入姓名 (必填)">
    </div>
    <div class="input-group">
        <label>平板編號</label>
        <input type="text" id="deviceInput" placeholder="例如：A15">
    </div>

    <button class="role-btn" onclick="joinAsStudent()" style="margin-top:30px; background:var(--accent); color:#0f172a;">進入教室</button>
  </div>

  <div id="studentView" class="hidden">
    <div class="student-info-bar">
      <div style="color:var(--primary);">編號：<span id="sPinDisplay" style="font-weight:bold;"></span></div>
      <div id="sNickname" style="font-weight:bold; font-size:16px; margin-top:4px; color:var(--text-dark);"></div>
      <div id="sRealName" style="font-size:12px;"></div>
    </div>
    
    <div id="studentMainContent">
        <div id="studentQuestion">等待老師開始...</div>
        <div id="myAnswerDisplay"></div>
        <div id="optionsContainer" class="options-grid hidden"></div>
        <div id="testNav" class="hidden" style="display: flex; justify-content: space-between; margin-top: 20px; align-items: center;">
          <button class="nav-btn" onclick="navTest(-1)">上一題</button>
          <span id="testProgress" style="font-size: 16px; font-weight: bold; color:var(--primary);"></span>
          <button id="nextOrSubmitBtn" class="nav-btn" onclick="navTest(1)">下一題</button>
        </div>
    </div>
    <audio id="studentAudio"></audio>
  </div>

  <div id="offlineOverlay" class="hidden">
    <h1 style="font-size:40px; color:var(--danger); margin-bottom:10px;">臨時中止</h1>
    <p style="font-size:18px;">老師大屏已離線，請等待重新連線...</p>
  </div>

  <div class="footer">
    <p>設計者：Iônn, Àn-tsiong | 技術支援：Gemini</p>
    <p style="margin-top: 2px;">Copyright &copy; 2025-2026 Iônn, Àn-tsiong. All Rights Reserved.<br>未經授權，嚴禁重製、改作或商用。</p>
  </div>

  <script type="module">
    const urlParams = new URLSearchParams(window.location.search);
    const pinFromUrl = urlParams.get('pin');
    if(pinFromUrl) {
        document.getElementById('pinInput').value = pinFromUrl;
        document.getElementById('pinInput').disabled = true; 
    }

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, set, onValue, onDisconnect, get } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    const firebaseConfig = { apiKey: "AIzaSyCXiyLVZfkGbKlBcFamVTjP3CfhSQfqy9c", authDomain: "tigitshikgiam.firebaseapp.com", databaseURL: "https://tigitshikgiam-default-rtdb.firebaseio.com", projectId: "tigitshikgiam", storageBucket: "tigitshikgiam.firebasestorage.app", messagingSenderId: "159559991455", appId: "1:159559991455:web:454559a0458d9ca461e2aa" };
    const app = initializeApp(firebaseConfig); const db = getDatabase(app);
    
    let selectedQuestions = [];
    let myStudentId = null, roomMode = 'kahoot'; 
    let currentSettings = { pin: '', showQuestion: true, status: 'waiting', audioSource: 'teacher', acceptAnswers: false };
    let myTestAnswers = {}, hasSubmittedTest = false, myTestIndex = 0;

    // 改用撲克花色
    const shapes = ["♣", "♦", "♥", "♠"];
    const avatars = ["🐱","🦁","🐮","🐨","🐻‍❄️","🦋","🦉","🦀","🐬","🐠","🐢","🐙","🐳","🐧","🐸","🐰","🐹","🦊","🐼","🐯","🐷","🐔","🐤","🦆","🦅","🦇","🐺","🐗","🐴","🦄"];

    function unlockAudio() { const stuAud = document.getElementById('studentAudio'); if(stuAud) { stuAud.play().then(() => stuAud.pause()).catch(e=>{}); } }

    window.joinAsStudent = async () => {
      unlockAudio();
      const pin = document.getElementById('pinInput').value.trim();
      const realName = document.getElementById('realNameInput').value.trim();
      const stuClass = document.getElementById('classInput').value.trim() || "";
      const seat = document.getElementById('seatInput').value.trim() || "";
      const device = document.getElementById('deviceInput').value.trim() || "";
      
      if(!pin || !realName) return alert("請確認「編號」與「姓名」皆已填寫！");

      const settingsSnap = await get(ref(db, 'room/settings'));
      if(!settingsSnap.exists() || settingsSnap.val().pin !== pin) return alert("試場編號錯誤或考試未建立！");

      const avatar = avatars[Math.floor(Math.random() * avatars.length)];
      // 平板上保留暱稱加上本名 (大屏只顯示暱稱)
      const nickname = realName + " 的平板"; 
      myStudentId = 'student_' + Date.now();
      
      const myRef = ref(db, `room/students/${myStudentId}`);
      set(myRef, { realName, nickname, avatar, score: 0, class: stuClass, seat: seat, device: device, isAI: false });
      onDisconnect(myRef).remove();

      document.getElementById('lobby').classList.add('hidden');
      document.getElementById('studentView').classList.remove('hidden');
      document.getElementById('sNickname').innerText = `${avatar} ${nickname}`;
      document.getElementById('sRealName').innerText = `(${realName} - 座號: ${seat})`;
      document.getElementById('sPinDisplay').innerText = pin;

      onValue(myRef, snap => { if (!snap.exists()) { alert("已被移出！"); window.location.reload(); }});
      listenToRoom();
    };

    function listenToRoom() {
      onValue(ref(db, 'room/settings/teacherOnline'), snap => {
         if(snap.val() === false) document.getElementById('offlineOverlay').classList.remove('hidden');
         else document.getElementById('offlineOverlay').classList.add('hidden');
      });

      onValue(ref(db, 'room/settings'), snap => {
        if(snap.exists()) {
          currentSettings = snap.val();
          roomMode = currentSettings.mode || 'kahoot';
          
          if(currentSettings.status === 'waiting') {
            document.getElementById('studentQuestion').innerText = "等待老師開始...";
            document.getElementById('optionsContainer').classList.add('hidden');
            document.getElementById('myAnswerDisplay').innerText = "";
            document.getElementById('testNav').classList.add('hidden');
            document.getElementById('studentMainContent').classList.remove('hidden');
            hasSubmittedTest = false; myTestAnswers = {};
          }
          if(currentSettings.status === 'ended') {
             document.getElementById('studentQuestion').innerText = "測驗已結束，請看大屏聽老師講解。";
             document.getElementById('optionsContainer').classList.add('hidden');
             document.getElementById('testNav').classList.add('hidden');
          }
          
          if(currentSettings.status === 'reviewing' && currentSettings.showAnswer) {
              document.getElementById('studentMainContent').classList.remove('hidden');
              document.getElementById('optionsContainer').classList.remove('hidden');
              document.getElementById('testNav').classList.remove('hidden');
              renderTestQuestion(); 
          }

          updateStudentUI();
        }
      });

      onValue(ref(db, 'room/currentKahootQ'), snap => {
        if(roomMode === 'kahoot' && snap.exists() && currentSettings.status === 'kahoot_active') renderStudentQuestion(snap.val());
      });

      onValue(ref(db, 'room/testPaper'), snap => {
        if(snap.exists() && currentSettings.status !== 'waiting') {
          selectedQuestions = snap.val();
          if(currentSettings.status === 'testing' && !hasSubmittedTest) {
              myTestIndex = 0;
              document.getElementById('studentMainContent').classList.remove('hidden');
              document.getElementById('testNav').classList.remove('hidden');
              renderTestQuestion();
          }
        }
      });
    }

    function renderStudentQuestion(qData) {
      if(hasSubmittedTest && !currentSettings.showAnswer) return;
      document.getElementById('studentQuestion').innerText = currentSettings.showQuestion ? qData.question : "請看大屏題目作答";
      document.getElementById('myAnswerDisplay').innerText = ""; 
      
      const optC = document.getElementById('optionsContainer');
      optC.innerHTML = ''; optC.classList.remove('hidden');
      
      qData.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = `option-btn opt-${idx % 4}`;
        btn.innerHTML = `<span class="shape">${shapes[idx % 4]}</span><span class="text">${opt}</span>`;
        
        btn.onclick = () => {
            if(!currentSettings.acceptAnswers) return;
            document.querySelectorAll('.option-btn').forEach(b => b.classList.add('dimmed'));
            btn.classList.remove('dimmed');
            btn.classList.add('selected');
            submitAnswer(opt, btn, qData.questionId);
        };
        optC.appendChild(btn);
      });
      if(qData.audio && currentSettings.audioSource === 'student') { document.getElementById('studentAudio').src = qData.audio; document.getElementById('studentAudio').play().catch(e=>{}); }
      updateStudentUI();
    }

    function submitAnswer(selectedOpt, btnElement, qId) {
      if(!currentSettings.acceptAnswers) return;
      if(roomMode === 'kahoot') {
        set(ref(db, `room/kahootAnswers/${myStudentId}`), { answer: selectedOpt, time: Date.now() - currentSettings.qStartTime });
        
        document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
        const praises = ["手腳誠猛喔！", "水啦！", "讚喔！", "繼續保持！", "等待結算中...", "好勢好勢！", "真有氣勢！"];
        document.getElementById('myAnswerDisplay').innerHTML = `<span style="color:var(--text-light);">${praises[Math.floor(Math.random()*praises.length)]}</span>`;
      } else {
        myTestAnswers[myTestIndex] = selectedOpt;
        set(ref(db, `room/testAnswers/${myStudentId}/${myTestIndex}`), {answer: selectedOpt});
        renderTestQuestion();
      }
    }

    window.navTest = (dir) => {
      if(hasSubmittedTest && !currentSettings.showAnswer) return; 
      
      if(dir === 1 && myTestIndex === selectedQuestions.length - 1 && !hasSubmittedTest && currentSettings.status === 'testing') {
          if(confirm("交卷後不得修改答案，確定交卷？")) {
            hasSubmittedTest = true;
            set(ref(db, `room/testAnswers/${myStudentId}/isSubmitted`), true);
            document.getElementById('studentQuestion').innerText = "請靜待所有考生作答完畢，勿關閉此畫面。";
            document.getElementById('optionsContainer').classList.add('hidden');
            document.getElementById('myAnswerDisplay').innerText = "";
            document.getElementById('testNav').classList.add('hidden');
          }
          return;
      }
      myTestIndex += dir;
      if(myTestIndex < 0) myTestIndex = 0;
      if(myTestIndex > selectedQuestions.length - 1) myTestIndex = selectedQuestions.length - 1;
      renderTestQuestion();
    };

    function renderTestQuestion() {
      if(selectedQuestions.length === 0) return;
      const qData = selectedQuestions[myTestIndex];
      document.getElementById('testProgress').innerText = `${myTestIndex + 1} / ${selectedQuestions.length}`;
      const nBtn = document.getElementById('nextOrSubmitBtn');
      
      if(currentSettings.status === 'reviewing') {
          if(myTestIndex === selectedQuestions.length - 1) { nBtn.innerText = "已到最後一題"; nBtn.style.background = "#e2e8f0"; nBtn.disabled = true; } 
          else { nBtn.innerText = "下一題"; nBtn.style.background = "var(--text-light)"; nBtn.disabled = false; }
      } else if(myTestIndex === selectedQuestions.length - 1 && !hasSubmittedTest && currentSettings.status === 'testing') { 
          nBtn.innerText = "交卷"; nBtn.style.background = "var(--danger)"; nBtn.style.color = "white"; nBtn.disabled = false;
      } else { 
          nBtn.innerText = "下一題"; nBtn.style.background = "var(--text-light)"; nBtn.style.color = "white"; nBtn.disabled = false;
      }

      renderStudentQuestion(qData);
      
      if(myTestAnswers[myTestIndex] && currentSettings.status !== 'reviewing') {
        document.getElementById('myAnswerDisplay').innerHTML = `已選擇：<span style="color:var(--primary);">${myTestAnswers[myTestIndex]}</span>`;
        document.querySelectorAll('.option-btn').forEach(b => {
          b.style.backgroundColor = (b.innerText === myTestAnswers[myTestIndex]) ? '#f1f5f9' : 'white';
        });
      }

      if(currentSettings.showAnswer && currentSettings.status === 'reviewing') {
          const cAns = qData.correctAnswer;
          let isCorrect = false;
          document.querySelectorAll('.option-btn').forEach(b => {
             b.disabled = true; 
             const optText = b.querySelector('.text').innerText;
             if(optText === cAns) {
                 b.classList.add('reveal-correct');
                 if(myTestAnswers[myTestIndex] === cAns) isCorrect = true;
             } else if (optText === myTestAnswers[myTestIndex]) {
                 b.classList.add('reveal-wrong');
             } else {
                 b.classList.add('dimmed');
             }
          });
          const ansText = myTestAnswers[myTestIndex] ? myTestAnswers[myTestIndex] : "未作答";
          document.getElementById('myAnswerDisplay').innerHTML = isCorrect ? `<span style="color:var(--success);">🟢 答對了！</span> 您的答案：${ansText}` : `<span style="color:var(--danger);">🔴 答錯了！</span> 您的答案：${ansText}`;
      }
    }

    function updateStudentUI() {
      // 依據 acceptAnswers 鎖定未送出者的畫面
      if (!currentSettings.acceptAnswers && currentSettings.status === 'kahoot_active') {
        document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
      }
      
      if (currentSettings.status === 'reviewing' && roomMode === 'test' && hasSubmittedTest) {
          document.getElementById('studentMainContent').classList.remove('hidden');
          document.getElementById('testNav').classList.remove('hidden'); 
          renderTestQuestion();
      }
      
      if(currentSettings.status === 'kahoot_result' && roomMode === 'kahoot') {
          document.getElementById('myAnswerDisplay').innerText = "";
          document.querySelectorAll('.option-btn').forEach(b => {
             b.disabled = true;
             const optText = b.querySelector('.text').innerText;
             if(optText === currentSettings.currentCorrect) b.classList.add('reveal-correct');
             else b.classList.add('reveal-wrong'); 
          });
      }
    }
  </script>
</body>
</html>
