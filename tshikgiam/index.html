<div class="footer">

        <div class="counter-container">
            <a href="https://www.hitwebcounter.com/" target="_blank">
                <img src="https://hitwebcounter.com/counter/counter.php?page=21440561&style=0008&nbdigits=6&type=page&initCount=0" title="Counters" border="0" />
            </a>
        </div>
        <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, set, onValue, onDisconnect, remove, get } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    // 您的 Firebase 專屬金鑰
    const firebaseConfig = {
      apiKey: "AIzaSyCXiyLVZfkGbKlBcFamVTjP3CfhSQfqy9c",
      authDomain: "tigitshikgiam.firebaseapp.com",
      databaseURL: "https://tigitshikgiam-default-rtdb.firebaseio.com",
      projectId: "tigitshikgiam",
      storageBucket: "tigitshikgiam.firebasestorage.app",
      messagingSenderId: "159559991455",
      appId: "1:159559991455:web:454559a0458d9ca461e2aa"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const sheetId = '1qe2gPJA_feyOCjUNz5iMHkeCWDHxTefQZ5d8QCBsrZA';
    const sheetUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;
    
    // 全域變數
    let allQuestions = [];
    let myStudentId = null;
    let roomMode = 'kahoot'; // 'kahoot' 或 'test'
    let currentSettings = { showQuestion: true, showAnswer: false, acceptAnswers: true, audioSource: 'teacher' };
    let currentCorrectAnswer = "";
    
    // 測驗模式專用變數
    let myTestIndex = 0;
    let myTestAnswers = {}; // { 0: '選項A', 1: '選項B' }
    let testCountdownTimer = null;

    // === 大廳介面切換 ===
    window.showTeacherModeSelect = () => {
      document.getElementById('roleSelection').classList.add('hidden');
      document.getElementById('teacherModeBox').classList.remove('hidden');
    };
    window.showStudentLogin = () => {
      document.getElementById('roleSelection').classList.add('hidden');
      document.getElementById('studentLoginBox').classList.remove('hidden');
    };

    // 暱稱產生器
    const adjs = ["古錐的", "緣投的", "𠢕早的", "打拚的", "快樂的", "勇敢的"];
    const animals = ["台灣黑熊", "石虎", "水鹿", "台灣藍鵲", "水豚", "獼猴"];
    function generateNickname() { return adjs[Math.floor(Math.random() * adjs.length)] + animals[Math.floor(Math.random() * animals.length)]; }

    // ==========================================
    // 學生端邏輯
    // ==========================================
    window.joinAsStudent = () => {
      const realName = document.getElementById('realNameInput').value.trim() || "未命名";
      const nickname = generateNickname();
      myStudentId = 'student_' + Date.now();

      const myRef = ref(db, `room/students/${myStudentId}`);
      set(myRef, { realName, nickname, score: 0 });
      onDisconnect(myRef).remove();

      document.getElementById('lobby').classList.add('hidden');
      document.getElementById('studentView').classList.remove('hidden');
      document.getElementById('sNickname').innerText = `👤 ${nickname}`;
      document.getElementById('sRealName').innerText = `(本名: ${realName})`;

      // 監聽是否被剔除
      onValue(myRef, (snap) => {
        if (!snap.exists()) { alert("您已被老師移出教室！"); window.location.reload(); }
      });

      listenToRoom();
    };

    function listenToRoom() {
      // 監聽全域設定與模式
      onValue(ref(db, 'room/settings'), (snap) => {
        if(snap.exists()) {
          currentSettings = snap.val();
          roomMode = currentSettings.mode || 'kahoot';
          updateStudentUI();
        }
      });

      // Kahoot 模式：監聽單一題目
      onValue(ref(db, 'room/currentQuestion'), (snap) => {
        if(roomMode === 'kahoot' && snap.exists()) {
          renderStudentQuestion(snap.val());
        } else if (roomMode === 'kahoot' && !snap.exists()) {
          document.getElementById('studentQuestion').innerText = "等待老師派題中...";
          document.getElementById('optionsContainer').classList.add('hidden');
          document.getElementById('myAnswerDisplay').innerText = "";
        }
      });

      // 測驗模式：監聽整份考卷派發
      onValue(ref(db, 'room/testPaper'), (snap) => {
        if(roomMode === 'test' && snap.exists()) {
          allQuestions = snap.val();
          myTestIndex = 0;
          document.getElementById('testNav').classList.remove('hidden');
          renderTestQuestion();
        }
      });
    }

    // 渲染單一題目介面
    function renderStudentQuestion(qData) {
      currentCorrectAnswer = qData.correctAnswer;
      document.getElementById('studentQuestion').innerText = currentSettings.showQuestion ? qData.question : "請看大屏題目並作答";
      document.getElementById('myAnswerDisplay').innerText = ""; // 清除上一題的顯示
      
      const optContainer = document.getElementById('optionsContainer');
      optContainer.innerHTML = '';
      optContainer.classList.remove('hidden');

      qData.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        btn.onclick = () => submitAnswer(opt, btn, qData.questionId);
        optContainer.appendChild(btn);
      });

      if(qData.audio && currentSettings.audioSource === 'student') {
        const audioEl = document.getElementById('studentAudio');
        audioEl.src = qData.audio;
        audioEl.play().catch(e=>console.log("自動播放被阻擋"));
      }
      updateStudentUI();
    }

    // 學生送出答案
    function submitAnswer(selectedOpt, btnElement, qId = 'current') {
      if(!currentSettings.acceptAnswers) return;

      if(roomMode === 'kahoot') {
        set(ref(db, `room/answers/${myStudentId}`), { answer: selectedOpt, timestamp: Date.now() });
        document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
      } else {
        myTestAnswers[myTestIndex] = selectedOpt;
        set(ref(db, `room/testAnswers/${myStudentId}/${myTestIndex}`), selectedOpt);
        renderTestQuestion(); // 重新渲染以反映選中狀態
      }

      document.getElementById('myAnswerDisplay').innerText = `👉 您已選擇：${selectedOpt}`;

      if (currentSettings.showAnswer && roomMode === 'kahoot') {
         if(selectedOpt === currentCorrectAnswer) btnElement.classList.add('correct');
         else btnElement.classList.add('wrong');
      }
    }

    // 測驗模式：學生本地切換題目
    window.navTest = (dir) => {
      myTestIndex += dir;
      if(myTestIndex < 0) myTestIndex = 0;
      if(myTestIndex >= allQuestions.length) myTestIndex = allQuestions.length - 1;
      renderTestQuestion();
    };

    function renderTestQuestion() {
      if(allQuestions.length === 0) return;
      const qData = allQuestions[myTestIndex];
      document.getElementById('testProgress').innerText = `第 ${myTestIndex + 1} / ${allQuestions.length} 題`;
      renderStudentQuestion(qData);
      
      // 標示已選答案
      if(myTestAnswers[myTestIndex]) {
        document.getElementById('myAnswerDisplay').innerText = `👉 您已選擇：${myTestAnswers[myTestIndex]}`;
        const btns = document.querySelectorAll('.option-btn');
        btns.forEach(b => {
          if(b.innerText === myTestAnswers[myTestIndex]) {
            b.style.backgroundColor = '#bbdefb';
            b.style.borderColor = var(--primary);
          } else {
            b.style.backgroundColor = 'white';
          }
        });
      }
    }

    function updateStudentUI() {
      if (!currentSettings.acceptAnswers) {
        document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
        document.getElementById('myAnswerDisplay').innerText += " (已收卷/鎖定)";
      }
    }

    // ==========================================
    // 教師端邏輯
    // ==========================================
    window.joinAsTeacher = (mode) => {
      roomMode = mode;
      document.getElementById('lobby').classList.add('hidden');
      document.getElementById('teacherView').classList.remove('hidden');
      document.getElementById('modeDisplay').innerText = mode === 'kahoot' ? '即時回饋模式' : '測驗模式';
      
      if(mode === 'test') {
        document.getElementById('testModeControls').classList.remove('hidden');
        document.getElementById('questionListTitle').innerText = '📝 測驗卷預覽';
      }

      // 初始化：清空舊資料
      remove(ref(db, 'room/currentQuestion'));
      remove(ref(db, 'room/testPaper'));
      remove(ref(db, 'room/answers'));
      
      currentSettings.mode = mode;
      set(ref(db, 'room/settings'), currentSettings);
      
      // 載入題庫
      fetch(sheetUrl).then(res => res.text()).then(text => {
        const data = JSON.parse(text.substring(47).slice(0, -2));
        const list = document.getElementById('questionList');
        list.innerHTML = '';
        allQuestions = data.table.rows.map((row, index) => ({
          questionId: index,
          q: row.c[0]?.v || '',
          ans: row.c[1]?.v || '',
          opts: [row.c[1]?.v, row.c[2]?.v, row.c[3]?.v, row.c[4]?.v].filter(Boolean),
          audio: row.c[5]?.v || null
        })).filter(item => item.q);

        allQuestions.forEach((item, idx) => {
          const btnHtml = mode === 'kahoot' 
            ? `<button id="btn-dispatch-${idx}" class="send-btn" onclick="dispatch(${idx}, this)">🚀 派送</button>`
            : `<span>題目已就緒</span>`;
          list.innerHTML += `
            <div class="question-item">
              <span><b>Q${idx+1}:</b> ${item.q} ${item.audio ? '🎵' : ''}</span>
              ${btnHtml}
            </div>
          `;
        });
      });

      // 監聽學生名單 (滑鼠點擊無痕剔除)
      onValue(ref(db, 'room/students'), (snap) => {
        const sList = document.getElementById('studentList');
        sList.innerHTML = '';
        let count = 0;
        if(snap.exists()) {
          snap.forEach(child => {
            count++;
            const s = child.val();
            // 直接將 onclick 綁定在整個學生項目上
            sList.innerHTML += `
              <div class="student-item" title="點擊即可剔除此學生" onclick="kickStudent('${child.key}')">
                <span>${s.nickname}</span>
                <span style="color:#888;">${s.realName}</span>
              </div>
            `;
          });
        }
        document.getElementById('studentCount').innerText = count;
      });
      
      // 監聽排行榜動畫數據
      onValue(ref(db, 'room/answers'), (snap) => {
         if(roomMode === 'kahoot' && document.getElementById('animationPanel').classList.contains('hidden') === false) {
             updateKahootLeaderboard(snap);
         }
      });
    };

    // Kahoot 派題
    window.dispatch = (idx, btnElement) => {
      // 鎖定當前按鈕防呆
      document.querySelectorAll('.send-btn').forEach(b => b.disabled = false);
      btnElement.disabled = true;
      btnElement.innerText = "已派送";

      const qData = allQuestions[idx];
      remove(ref(db, 'room/answers'));
      currentSettings.acceptAnswers = true;
      currentSettings.showAnswer = false;
      document.getElementById('toggleAns').innerText = '公布解答：關';
      document.getElementById('toggleAns').classList.remove('active');
      set(ref(db, 'room/settings'), currentSettings);

      const shuffled = qData.opts.sort(() => Math.random() - 0.5);
      set(ref(db, 'room/currentQuestion'), {
        questionId: qData.questionId,
        question: qData.q,
        options: shuffled,
        correctAnswer: qData.ans,
        audio: qData.audio,
        timestamp: Date.now()
      });

      if(qData.audio && currentSettings.audioSource === 'teacher') {
        const audioEl = document.getElementById('studentAudio');
        audioEl.src = qData.audio;
        audioEl.play().catch(e=>console.log("需互動才能播放"));
      }
    };

    // 測驗模式：發派全卷與倒數
    window.startTestMode = () => {
      const mins = parseInt(document.getElementById('testMinutes').value) || 5;
      const confirmStart = confirm(`確定要發派測驗並倒數 ${mins} 分鐘嗎？`);
      if(!confirmStart) return;

      currentSettings.acceptAnswers = true;
      set(ref(db, 'room/settings'), currentSettings);

      // 處理所有題目的洗牌
      const paper = allQuestions.map(q => {
         return {
             questionId: q.questionId,
             question: q.q,
             options: q.opts.sort(() => Math.random() - 0.5),
             correctAnswer: q.ans,
             audio: q.audio
         };
      });
      set(ref(db, 'room/testPaper'), paper);
      
      // 切換為動畫(碼錶)面板
      if(document.getElementById('animationPanel').classList.contains('hidden')) {
          toggleLeftPanel();
      }
      
      document.getElementById('animTitle').innerText = "⏳ 測驗倒數中";
      let timeLeft = mins * 60;
      
      clearInterval(testCountdownTimer);
      testCountdownTimer = setInterval(() => {
          timeLeft--;
          const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
          const s = (timeLeft % 60).toString().padStart(2, '0');
          document.getElementById('animContent').innerHTML = `<div class="timer-display">${m}:${s}</div>`;
          
          if(timeLeft <= 0) {
              clearInterval(testCountdownTimer);
              stopAnswering();
              document.getElementById('animContent').innerHTML = `<div class="timer-display" style="color:red;">00:00</div><br><h2>時間到，已自動收卷！</h2>`;
          }
      }, 1000);
    };

    // 隱藏/顯示 左側題庫與動畫面板
    window.toggleLeftPanel = () => {
      const qw = document.getElementById('questionListWrapper');
      const ap = document.getElementById('animationPanel');
      if(qw.classList.contains('hidden')) {
        qw.classList.remove('hidden');
        ap.classList.add('hidden');
      } else {
        qw.classList.add('hidden');
        ap.classList.remove('hidden');
      }
    };

    // Kahoot 簡易排行榜動畫 (顯示已作答人數)
    function updateKahootLeaderboard(answersSnap) {
       let count = 0;
       if(answersSnap.exists()) {
           answersSnap.forEach(()=>count++);
           document.getElementById('animTitle').innerText = "🔥 作答動態";
           document.getElementById('animContent').innerHTML = `<div class="timer-display" style="color:#1976d2;">${count} 人已作答</div>`;
       } else {
           document.getElementById('animContent').innerHTML = "等待學生作答...";
       }
    }

    // 控制台更新設定
    window.updateSettings = (key, val) => {
      currentSettings[key] = val;
      set(ref(db, 'room/settings'), currentSettings);
    };

    window.toggleSetting = (key, btn) => {
      currentSettings[key] = !currentSettings[key];
      btn.innerText = (key === 'showQuestion' ? '平板題目：' : '公布解答：') + (currentSettings[key] ? '開' : '關');
      btn.classList.toggle('active', currentSettings[key]);
      set(ref(db, 'room/settings'), currentSettings);
    };

    window.stopAnswering = () => {
      currentSettings.acceptAnswers = false;
      set(ref(db, 'room/settings'), currentSettings);
    };

    window.kickStudent = (id) => {
      remove(ref(db, `room/students/${id}`));
    };

    window.toggleBGM = () => {
      const audio = document.getElementById('bgmAudio');
      const btn = document.getElementById('bgmBtn');
      if (audio.paused) { audio.play(); btn.innerText = "暫停"; btn.classList.add('active'); } 
      else { audio.pause(); btn.innerText = "播放"; btn.classList.remove('active'); }
    };

    window.exportCSV = async () => {
      // CSV 匯出邏輯保持不變...
      alert("成績匯出功能已觸發 (開發測試中)");
    };
  </script>
</body>
