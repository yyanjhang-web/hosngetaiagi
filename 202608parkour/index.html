<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>台語跑酷</title>
    <!-- 引入彩帶特效函式庫 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; overflow: hidden; background-color: #f0f9ff; touch-action: none; }
        #menu, #game-over { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #e0f2f7; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; padding: 20px; box-sizing: border-box; }
        .lesson-btn { padding: 10px; margin: 5px; background: #ccc; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
        .lesson-btn.active { background: #20b2aa; color: white; }
        
        #game-board { display: none; width: 100vw; height: 100vh; position: relative; background: #333; overflow: hidden; box-sizing: border-box; }
        
        /* 錯誤閃爍特效 */
        @keyframes flashRed {
            0% { box-shadow: inset 0 0 0 0 red; }
            25% { box-shadow: inset 0 0 40px 20px red; }
            50% { box-shadow: inset 0 0 0 0 red; }
            75% { box-shadow: inset 0 0 40px 20px red; }
            100% { box-shadow: inset 0 0 0 0 red; }
        }
        .flash-error { animation: flashRed 0.5s; pointer-events: none; }
        
        #hud { position: absolute; top: 10px; left: 20px; right: 20px; color: white; font-size: 20px; display: flex; justify-content: space-between; z-index: 2; text-shadow: 2px 2px 4px #000; pointer-events: none; }
        #question-display { position: absolute; top: 10px; width: 100%; text-align: center; color: yellow; font-size: 32px; font-weight: bold; z-index: 2; text-shadow: 2px 2px 4px #000; pointer-events: none; }
        
        /* 玩家圖示 */
        #player { position: absolute; width: 60px; height: 60px; z-index: 2; text-align: center; line-height: 60px; font-size: 55px; transform: scaleX(-1); pointer-events: none; }
        
        .obstacle { position: absolute; z-index: 1; display: flex; align-items: center; justify-content: center; }
        
        .text-card { width: 250px; height: 15vh; background: white; border-radius: 10px; font-weight: bold; font-size: clamp(16px, 3vw, 24px); box-shadow: 0 4px 8px rgba(0,0,0,0.3); color: #333; }
        
        .bonus, .rocket { height: 100px; width: 100px; font-size: 70px; }
        
        .star-icon { display: inline-block; animation: pulse 1s infinite; }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
        
        button.start-btn { padding: 15px 30px; font-size: 20px; background: #f59e0b; color: white; border: none; border-radius: 10px; margin-top: 20px; cursor: pointer; }
    </style>
</head>
<body>

<div id="menu">
    <h2>台語跑酷</h2>
    <div id="lessons"></div>
    <div style="margin: 20px 0;">
        <label><input type="radio" name="mode" value="hanzi" checked> 看漢字選發音</label>
        <label><input type="radio" name="mode" value="roma"> 看發音選漢字</label>
    </div>
    <button class="start-btn" onclick="startGame()">開始遊戲</button>
</div>

<div id="game-over" style="display: none;">
    <h2>時間到！</h2>
    <p>總分：<span id="final-score">0</span></p>
    <button class="start-btn" onclick="location.reload()">回主選單</button>
</div>

<div id="game-board">
    <div id="hud">
        <span id="time-display">時間: 50</span>
        <span id="score-display">分數: 0</span>
    </div>
    <div id="question-display">題目</div>
    <div id="player">🏃</div>
</div>

<script>
    const SPREADSHEET_ID = "1V-IiZVEaQVewTZa9iX-SBWfy_30X1fHhRkDNJVvV_Rc";
    const lessons = ["B2L1", "B2L2", "B2L3", "B2L4", "B4L1", "B4L2", "B4L3", "B4L4"];
    let selectedLessons = [];
    let activeCards = [];
    
    // 遊戲時間調為 50 秒
    let time = 50, score = 0, speed = 3.5, maxSpeed = 8.0, elapsedTime = 0, questionCount = 0;
    let gameLoop, itemInterval;
    let currentMode = 'hanzi';
    let currentQuestionType = 'normal';

    // 自由移動變數
    let playerX = 80;
    let playerY = 0;
    let playerSpeed = 7;
    let keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, w: false, s: false, a: false, d: false };

    const lessonsDiv = document.getElementById('lessons');
    lessons.forEach(l => {
        const btn = document.createElement('button');
        btn.className = 'lesson-btn';
        btn.innerText = l;
        btn.onclick = () => {
            btn.classList.toggle('active');
            if(selectedLessons.includes(l)) selectedLessons = selectedLessons.filter(x => x !== l);
            else selectedLessons.push(l);
        };
        lessonsDiv.appendChild(btn);
    });

    async function startGame() {
        if(selectedLessons.length === 0) return alert("請至少選擇一課！");
        currentMode = document.querySelector('input[name="mode"]:checked').value;
        document.getElementById('menu').style.display = 'none';
        
        document.getElementById('question-display').innerText = "載入中...";
        document.getElementById('game-board').style.display = 'block';
        
        // 初始角色位置 (畫面垂直置中)
        playerY = window.innerHeight / 2 - 30;
        document.getElementById('player').style.left = playerX + 'px';
        document.getElementById('player').style.top = playerY + 'px';

        const fetchPromises = selectedLessons.map(sheet => 
            fetch(`https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${sheet}`).then(res => res.text())
        );

        const results = await Promise.all(fetchPromises);
        activeCards = [];
        results.forEach(text => {
            text.split(/\r?\n/).forEach(l => {
                const p = l.replace(/"/g, '').replace(/，/g, ',').split(',');
                if(p.length >= 2) activeCards.push({ h: p[0].trim(), r: p[1].trim() });
            });
        });

        if(activeCards.length < 3) return alert("詞庫不足，請多選幾課！");
        
        spawnQuestion();
        gameLoop = requestAnimationFrame(update);
        itemInterval = setInterval(timerTick, 1000);
    }

    function timerTick() {
        time--;
        elapsedTime++;
        if(elapsedTime > 0 && elapsedTime % 20 === 0) {
            speed = Math.min(speed + 0.5, maxSpeed); 
        }
        document.getElementById('time-display').innerText = `時間: ${time}`;
        if(time <= 0) endGame();
    }

    function spawnQuestion() {
        document.querySelectorAll('.obstacle').forEach(e => e.remove());
        currentQuestionType = 'normal'; 

        if (questionCount > 0 && questionCount % 4 === 0) currentQuestionType = 'rocket';
        else if (questionCount > 0 && questionCount % 2 === 0) currentQuestionType = 'star';

        const screenWidth = window.innerWidth;
        const screenHeight = window.innerHeight;

        if (currentQuestionType === 'rocket') {
            document.getElementById('question-display').innerText = "躲避火箭！被撞會加速！";
            for (let col = 0; col < 3; col++) {
                let emptyLane = Math.floor(Math.random() * 3);
                for (let l = 0; l < 3; l++) {
                    if (l !== emptyLane) {
                        createEntity('rocket', '', false, screenWidth + (col * 400), (screenHeight / 3) * l + (screenHeight/6) - 50);
                    }
                }
            }
            return;
        }

        if (currentQuestionType === 'star') {
            document.getElementById('question-display').innerText = "抓星星！每顆 +1 秒！";
            for (let col = 0; col < 3; col++) {
                let starLane = Math.floor(Math.random() * 3);
                createEntity('star', '', false, screenWidth + (col * 400), (screenHeight / 3) * starLane + (screenHeight/6) - 50);
            }
            return;
        }

        const deck = [...activeCards].sort(() => Math.random() - 0.5);
        const target = deck[0];
        const wrongs = deck.slice(1, 3);
        
        document.getElementById('question-display').innerText = currentMode === 'hanzi' ? target.h : target.r;
        
        let options = [target, wrongs[0], wrongs[1]].sort(() => Math.random() - 0.5);
        options.forEach((opt, index) => {
            const isCorrect = (opt === target);
            const text = currentMode === 'hanzi' ? opt.r : opt.h;
            // 讓選項均勻分布在三等分的車道中間
            createEntity('text', text, isCorrect, screenWidth, (screenHeight / 3) * index + (screenHeight/6) - (window.innerHeight * 0.075));
        });
    }

    function createEntity(type, text = '', isCorrect = false, startX, startY) {
        const el = document.createElement('div');
        el.className = 'obstacle';
        
        if(type === 'star') { 
            el.classList.add('bonus'); 
            el.innerHTML = '<span class="star-icon">⭐</span>';
        } else if(type === 'rocket') { 
            el.classList.add('rocket'); 
            el.innerText = "🚀"; 
        } else {
            el.classList.add('text-card');
            el.innerText = text;
        }
        
        el.dataset.correct = isCorrect;
        el.dataset.type = type;
        el.dataset.x = startX; 
        el.dataset.resolved = 'false'; 
        
        el.style.top = `${startY}px`;
        el.style.left = `${startX}px`;
        
        document.getElementById('game-board').appendChild(el);
    }

    function triggerCorrectEffect() {
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
    }

    function triggerWrongEffect() {
        const board = document.getElementById('game-board');
        board.classList.remove('flash-error');
        void board.offsetWidth; // 強制重繪以重啟動畫
        board.classList.add('flash-error');
    }

    function update() {
        if(time <= 0) return;

        // 處理玩家四向移動
        if (keys.ArrowUp || keys.w || keys.W) playerY -= playerSpeed;
        if (keys.ArrowDown || keys.s || keys.S) playerY += playerSpeed;
        if (keys.ArrowLeft || keys.a || keys.A) playerX -= playerSpeed;
        if (keys.ArrowRight || keys.d || keys.D) playerX += playerSpeed;

        // 限制玩家在畫面範圍內
        playerX = Math.max(0, Math.min(playerX, window.innerWidth - 60));
        playerY = Math.max(0, Math.min(playerY, window.innerHeight - 60));

        const playerEl = document.getElementById('player');
        playerEl.style.left = playerX + 'px';
        playerEl.style.top = playerY + 'px';

        const pRect = playerEl.getBoundingClientRect();
        const obstacles = document.querySelectorAll('.obstacle');
        let questionResolved = false;

        obstacles.forEach(obs => {
            let x = parseFloat(obs.dataset.x) - speed; 
            obs.dataset.x = x;
            obs.style.left = `${x}px`;
            
            const oRect = obs.getBoundingClientRect();

            // 精確的邊框碰撞偵測 (AABB) 增加了一點容錯率 (內縮10px)
            const tolerance = 10;
            if (
                pRect.left + tolerance < oRect.right &&
                pRect.right - tolerance > oRect.left &&
                pRect.top + tolerance < oRect.bottom &&
                pRect.bottom - tolerance > oRect.top &&
                obs.dataset.resolved === 'false'
            ) {
                obs.dataset.resolved = 'true';
                
                if (obs.dataset.type === 'star') { 
                    time += 1; score += 10; 
                    obs.style.display = 'none'; 
                    triggerCorrectEffect();
                }
                else if (obs.dataset.type === 'rocket') { 
                    speed = Math.min(speed + 0.3, maxSpeed); 
                    obs.style.opacity = '0.2'; 
                    triggerWrongEffect();
                }
                else if (obs.dataset.type === 'text') {
                    if (obs.dataset.correct === 'true') { 
                        time += 3; score += 10; 
                        triggerCorrectEffect();
                    } else { 
                        time -= 2; 
                        triggerWrongEffect();
                    }
                    questionResolved = true;
                }
            } else if (x < -300) { 
                // 物件移出畫面
                if (obs.dataset.resolved === 'false') {
                    obs.dataset.resolved = 'true';
                    if (obs.dataset.type === 'text' && obs.dataset.correct === 'true') {
                        time -= 2; // 漏接正確答案扣秒
                        triggerWrongEffect();
                        questionResolved = true;
                    }
                }
                obs.remove(); 
            }
        });

        // 確保星星與火箭徹底移出或被判定後才進入下一題
        if (questionResolved && currentQuestionType === 'normal') {
            questionCount++;
            spawnQuestion();
        } else if (currentQuestionType === 'rocket' || currentQuestionType === 'star') {
            if (document.querySelectorAll(`.${currentQuestionType}`).length === 0) {
                questionCount++;
                spawnQuestion();
            }
        }
        
        document.getElementById('score-display').innerText = `分數: ${score}`;
        document.getElementById('time-display').innerText = `時間: ${time}`;
        gameLoop = requestAnimationFrame(update);
    }

    function endGame() {
        cancelAnimationFrame(gameLoop);
        clearInterval(itemInterval);
        document.getElementById('game-board').style.display = 'none';
        document.getElementById('game-over').style.display = 'flex';
        document.getElementById('final-score').innerText = score;
    }

    // 鍵盤操控綁定
    window.addEventListener('keydown', e => { if(keys.hasOwnProperty(e.key)) keys[e.key] = true; });
    window.addEventListener('keyup', e => { if(keys.hasOwnProperty(e.key)) keys[e.key] = false; });

    // 觸控螢幕拖曳控制 (指尖到哪，人就跟到哪，絕對直覺)
    const board = document.getElementById('game-board');
    let isTouching = false;
    let touchStartX, touchStartY, playerStartX, playerStartY;

    board.addEventListener('touchstart', (e) => {
        e.preventDefault();
        isTouching = true;
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        playerStartX = playerX;
        playerStartY = playerY;
    }, {passive: false});

    board.addEventListener('touchmove', (e) => {
        if (!isTouching) return;
        e.preventDefault();
        let dx = e.touches[0].clientX - touchStartX;
        let dy = e.touches[0].clientY - touchStartY;
        // 靈敏度可調，這裡設定為1:1跟隨手指滑動距離
        playerX = playerStartX + dx * 1.5; 
        playerY = playerStartY + dy * 1.5;
    }, {passive: false});

    board.addEventListener('touchend', () => { isTouching = false; });
</script>
</body>
</html>
