<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>台語聽寫特訓 - RPG特效版</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #1a1a2e; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; height: 100dvh; overflow: hidden; user-select: none; -webkit-user-select: none; }
        
        #app-container { position: relative; width: 100vw; height: 100vh; height: 100dvh; max-width: 800px; background-color: #16213e; display: flex; flex-direction: column; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
        
        #menu, #game-over { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #0f3460; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; z-index: 10; padding: 30px 20px; box-sizing: border-box; overflow-y: auto; }
        
        h2 { color: #e94560; font-size: 28px; margin-bottom: 20px; text-shadow: 0 0 10px rgba(233, 69, 96, 0.5); }
        
        .lesson-btn { padding: 10px 15px; margin: 5px; background: #2a3654; color: #fff; border: 2px solid #4a5c88; border-radius: 8px; font-size: 16px; cursor: pointer; transition: 0.2s; }
        .lesson-btn.active { background: #e94560; border-color: #ff6b81; box-shadow: 0 0 10px #e94560; }
        
        .toggle-container { margin: 20px 0; padding: 15px; background: #1a1a2e; border-radius: 10px; border: 1px solid #e94560; width: 80%; max-width: 400px; text-align: center; }
        
        button.start-btn { padding: 15px 40px; font-size: 22px; font-weight: bold; background: #0f3460; color: #00e5ff; border: 2px solid #00e5ff; border-radius: 10px; margin-top: 20px; cursor: pointer; box-shadow: 0 0 15px rgba(0, 229, 255, 0.4); transition: 0.2s; }
        button.start-btn:active { transform: scale(0.95); }

        /* 遊戲畫面 UI */
        #game-screen { display: none; flex-direction: column; height: 100%; padding: 10px 15px; box-sizing: border-box; justify-content: space-between; }
        
        .header-info { display: flex; justify-content: space-between; align-items: center; font-size: 18px; color: #00e5ff; margin-bottom: 10px; font-weight: bold; }
        #health-bar { font-size: 20px; letter-spacing: 3px; }
        .question-area { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; }

        /* 喇叭與漢字併排 */
        .question-row { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 10px; }
        .audio-icon { font-size: 36px; cursor: pointer; animation: pulse 1.5s infinite; color: #e94560; margin: 0; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 0.8;} 50% { transform: scale(1.1); opacity: 1;} 100% { transform: scale(1); opacity: 0.8;} }
        #hanzi-hint { font-size: 30px; color: #f9a826; font-weight: bold; text-shadow: 0 0 10px rgba(249, 168, 38, 0.5); margin: 0; }
        
        /* ==== RPG 戰鬥舞台 ==== */
        #rpg-arena { position: relative; width: 100%; height: 90px; background: rgba(0,0,0,0.3); border-radius: 10px; border-bottom: 3px solid #4a5c88; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 40px; box-sizing: border-box; margin-bottom: 5px; overflow: hidden; flex-shrink: 0;}
        .rpg-sprite { font-size: 55px; line-height: 1; transition: transform 0.2s ease-in-out, filter 0.2s; }
        #player-sprite { transform-origin: bottom center; z-index: 2; }
        #enemy-wrapper { display: flex; flex-direction: column; align-items: center; z-index: 1; }
        #enemy-hp-ui { font-size: 12px; letter-spacing: 2px; margin-bottom: 2px; text-shadow: 0 0 5px rgba(0,0,0,0.8); }
        #enemy-sprite { transform-origin: bottom center; filter: drop-shadow(0 0 10px red); }
        
        /* 戰鬥動畫 */
        .player-attack { transform: translateX(80px) rotate(15deg) !important; }
        .enemy-attack { transform: translateX(-60px) rotate(-15deg) !important; }
        .player-dodge { transform: translateY(-40px) rotate(-10deg) !important; }
        .player-hit { transform: translateX(-10px) rotate(-10deg) !important; filter: drop-shadow(0 0 20px red) sepia(1) hue-rotate(-50deg) saturate(5) !important; }
        .enemy-hit-flash { transform: translateX(10px) rotate(10deg) !important; filter: brightness(2) contrast(1.5) drop-shadow(0 0 20px white) !important; }
        .enemy-dead { transform: rotate(90deg) translateY(30px) !important; filter: grayscale(1) opacity(0.7) drop-shadow(0 0 0 transparent) !important; }
        
        .combat-effect { position: absolute; font-size: 40px; z-index: 3; opacity: 0; pointer-events: none; }
        @keyframes swordSlash { 0% { transform: translate(0, 0) rotate(-45deg) scale(0.5); opacity: 1; } 50% { transform: translate(120px, -20px) rotate(45deg) scale(1.5); opacity: 1; } 100% { transform: translate(180px, 20px) rotate(90deg) scale(1); opacity: 0; } }
        /* 通用投擲物軌跡 */
        @keyframes projFly { 0% { transform: translate(0, 0) rotate(0deg) scale(0.8); opacity: 1; } 50% { transform: translate(-100px, -20px) rotate(-180deg) scale(1.5); opacity: 1; } 100% { transform: translate(-220px, 0px) rotate(-360deg) scale(1.2); opacity: 0; } }

        .coin { position: absolute; font-size: 30px; animation: coinFly 1s ease-out forwards; opacity: 0; }
        @keyframes coinFly { 0% { transform: translate(0, 0) scale(0.5); opacity: 1; } 50% { transform: translate(0, -60px) scale(1.2); opacity: 1; } 100% { transform: translate(0, -20px) scale(1); opacity: 0; } }

        /* 倒數計時條 */
        #timer-container { width: 100%; height: 8px; background: #2a3654; border-radius: 5px; overflow: hidden; margin-bottom: 10px; position: relative; display: none; flex-shrink: 0;}
        #timer-bar { height: 100%; width: 100%; background: #00e5ff; transition: width 1s linear, background 0.3s; }
        #timer-text { position: absolute; right: 5px; top: -16px; font-size: 12px; color: #fff; font-weight: bold; }

        /* 輸入框 */
        #syllable-boxes-container { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 5px; width: 100%; }
        .syllable-box { min-width: 50px; height: 50px; padding: 0 10px; background: rgba(0, 0, 0, 0.4); border: 2px solid #4a5c88; border-radius: 8px; font-size: 26px; color: #fff; display: flex; justify-content: center; align-items: center; letter-spacing: 1px; font-family: monospace; transition: 0.2s; }
        .syllable-box.active-box { border-color: #00e5ff; box-shadow: inset 0 0 15px rgba(0, 229, 255, 0.3); color: #00e5ff; }
        .cursor { display: inline-block; width: 3px; height: 26px; background: #e94560; margin-left: 2px; animation: blink 1s step-end infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        /* ================================================= */
        /* 虛擬鍵盤與「自製 SVG 聲調系統」 */
        /* ================================================= */
        #keyboard { display: flex; flex-direction: column; gap: 5px; width: 100%; flex-shrink: 0; padding-bottom: 5px; }
        .kb-row { display: flex; justify-content: center; gap: 4px; }
        
        .key { position: relative; background: #2a3654; color: #fff; border: 2px solid #4a5c88; border-radius: 8px; min-height: 45px; min-width: 25px; flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.1s; box-sizing: border-box; }
        .key.active-key { background: #0f3460; border-color: #00e5ff; box-shadow: 0 0 8px rgba(0, 229, 255, 0.5); color: #00e5ff; }
        .key.active-key:active { background: #00e5ff; color: #000; transform: scale(0.92); }
        .key.disabled-key { background: #1a1a2e; border-color: #222; color: #444; pointer-events: none; }
        
        /* 聲調按鍵專屬佈局 */
        .tone-num { position: absolute; top: 3px; left: 5px; font-size: 11px; color: #78909c; font-weight: bold; line-height: 1; }
        .key.active-key .tone-num { color: #00b8d4; }
        .tone-symbol { font-size: 26px; line-height: 1; display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; padding-top: 5px;}
        
        /* 純手工繪製的無破綻聲調系統 */
        .custom-tone { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 26px; }
        .c-mark { height: 12px; font-size: 16px; line-height: 12px; font-family: Arial, sans-serif; font-weight: bold; display: flex; align-items: flex-end; justify-content: center; }
        .tone-svg { width: 14px; height: 14px; margin-top: 2px; overflow: visible;}
        .mark-8 { width: 2.5px; height: 8px; background-color: currentColor; border-radius: 1px; margin-bottom: 2px;}

        /* 入聲 (ptkh) 的 2x2 方塊排列 */
        .checked-tone-group { display: flex; align-items: center; justify-content: center; line-height: 1;}
        .checked-tone-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; font-size: 9px; margin-left: 4px; text-align: center; line-height: 0.9; font-family: Arial, sans-serif; color: #aaa;}
        .key.active-key .checked-tone-grid { color: #00e5ff; }

        /* 針對第6聲按鍵微調 */
        .key[data-key="6"] { flex: 0.6; opacity: 0.5; pointer-events: none; }
        .key[data-key="6"] .c-mark { font-size: 14px; color: #666; }

        .key-delete { background: #e94560 !important; border-color: #ff6b81 !important; color: white !important; flex: 1.4; font-size: 20px;}
        .key-delete:active { background: #ff6b81 !important; transform: scale(0.92); }
        
        /* 長按扣血鍵特化與動畫 */
        .key-skip { position: relative; overflow: hidden; background: #d32f2f !important; border-color: #f44336 !important; color: white !important; box-shadow: 0 0 10px rgba(244, 67, 54, 0.4) !important;}
        .key-skip::before { content: ''; position: absolute; left: 0; bottom: 0; height: 100%; width: 0%; background: rgba(255, 255, 255, 0.3); z-index: 1; transition: width 0s; }
        .key-skip.pressing::before { width: 100%; transition: width 2.5s linear; }
        .key-skip > div { position: relative; z-index: 2; pointer-events: none; }

        .key-tall { height: 100%; min-height: 95px; font-size: 16px; line-height: 1.3;}
        .key-enter { background: #00e5ff !important; border-color: #00b8d4 !important; color: #000 !important; font-size: 20px; box-shadow: 0 0 15px rgba(0, 229, 255, 0.4) !important;}
        .key-enter:active { background: #fff !important; transform: scale(0.92); }

        .shake { animation: shake 0.4s; }
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-10px); } 50% { transform: translateX(10px); } 75% { transform: translateX(-10px); } 100% { transform: translateX(0); } }
        .error-shake .syllable-box { border-color: red !important; box-shadow: inset 0 0 15px red !important; }

        #end-comment { font-size: 32px; font-weight: bold; margin-bottom: 20px; text-align: center; text-shadow: 0 0 15px rgba(0,0,0,0.8); }

        /* ========================================================= */
        /* 極致壓縮模式：手機橫向、小螢幕 */
        /* ========================================================= */
        @media (max-height: 700px) {
            #game-screen { padding: 5px 10px; }
            .header-info { margin-bottom: 5px; font-size: 14px; }
            #health-bar { font-size: 16px; }
            #rpg-arena { height: 60px; padding: 0 20px; margin-bottom: 2px; border-bottom-width: 2px; }
            .rpg-sprite { font-size: 40px; }
            #enemy-hp-ui { font-size: 9px; margin-bottom: 1px; }
            .combat-effect { font-size: 25px; }
            .coin { font-size: 20px; }
            .question-row { gap: 10px; margin-bottom: 2px; }
            .audio-icon { font-size: 24px; }
            #hanzi-hint { font-size: 22px; }
            #syllable-boxes-container { margin-bottom: 2px; gap: 5px; }
            .syllable-box { min-width: 40px; height: 40px; font-size: 22px; padding: 0 5px; border-width: 1px;}
            .cursor { height: 22px; }
            #timer-container { margin-bottom: 5px; height: 6px; }
            #timer-text { font-size: 10px; top: -14px; }
            
            #keyboard { gap: 3px; padding-bottom: 2px; }
            .kb-row { gap: 3px; }
            .key { min-height: 34px; border-radius: 5px; font-size: 15px; border-width: 1px;}
            .key-tall { min-height: 71px; font-size: 14px;}
            .key-enter, .key-delete { font-size: 16px; }
            
            /* 壓縮模式下的聲調符號微調 */
            .tone-num { font-size: 9px; top: 1px; left: 3px; }
            .c-mark { font-size: 13px; height: 10px; line-height: 10px; }
            .tone-svg { width: 12px; height: 12px; margin-top: 1px; }
            .mark-8 { height: 6px; margin-bottom: 1px;}
            .checked-tone-grid { font-size: 7px; gap: 0; margin-left: 2px; }
        }
    </style>
</head>
<body>

<div id="app-container">
    <div id="menu">
        <h2>🔊 台羅特訓 - RPG除魔戰</h2>
        <div id="lessons" style="display:flex; flex-wrap:wrap; justify-content:center; max-width: 600px;"></div>
        
        <div class="toggle-container">
            <p style="margin: 0 0 10px 0; font-size: 18px; color: #f9a826;">💡 漢字提示模式</p>
            <label style="font-size: 16px;">
                <input type="checkbox" id="hint-toggle" checked style="transform: scale(1.5); margin-right: 10px;">
                開啟提示 (得分減半)
            </label>
        </div>
        
        <p style="color:#aaa; font-size:14px; line-height: 1.6; text-align: center;">
            答錯 3 次扣一血，長按 Ctrl 或按鈕 2.5 秒可扣血跳過。<br>
            擊敗四陣妖物，光榮倒轉來！
        </p>
        <button class="start-btn" onclick="startGame()">開始出擊</button>
    </div>

    <div id="game-over" style="display: none;">
        <h2>戰鬥結束！</h2>
        <p style="font-size: 24px; margin-bottom: 15px;">總得分：<span id="final-score" style="color:#00e5ff; font-weight:bold; font-size: 40px;">0</span></p>
        <div id="end-comment"></div>
        <button class="start-btn" onclick="location.reload()" style="margin-top: 30px;">回主選單</button>
    </div>

    <div id="game-screen">
        <div class="header-info">
            <span id="score-display">分數: 0</span>
            <span id="health-bar">❤️❤️❤️</span>
            <span id="progress-display">進度: 0 / 14</span>
        </div>
        
        <div class="question-area">
            <div id="rpg-arena">
                <div class="rpg-sprite" id="player-sprite">🦸‍♂️</div>
                <div id="enemy-wrapper">
                    <div id="enemy-hp-ui">🔴</div>
                    <div class="rpg-sprite" id="enemy-sprite">🌵</div>
                </div>
            </div>

            <div id="timer-container">
                <span id="timer-text"></span>
                <div id="timer-bar"></div>
            </div>

            <div class="question-row">
                <div class="audio-icon" onclick="playAudio()">🔊</div>
                <div id="hanzi-hint"></div>
            </div>

            <div id="syllable-boxes-container"></div>
        </div>

        <div id="keyboard"></div>
    </div>
</div>

<script>
    const SPREADSHEET_ID = "1V-IiZVEaQVewTZa9iX-SBWfy_30X1fHhRkDNJVvV_Rc";
    const lessons = ["B1L1", "B1L2", "B1L3", "B1L4", "B3L1", "B3L2", "B3L3", "防災素一", "拼音練習"];
    let selectedLessons = [];
    let questionBank = [];
    
    // 遊戲狀態與計時器
    let score = 0; let hearts = 3; let currentQuestionIndex = 0; let maxQuestions = 14; 
    let streakCount = 0;
    let attempt = 1; let timer = null; let timeLeft = 0; let isHintEnabled = true;

    // 敵人系統設定
    const enemyConfig = [
        { sprite: '🌵', maxHp: 1, attack: '📍' },
        { sprite: '🐍', maxHp: 2, attack: '💧' },
        { sprite: '🕷️', maxHp: 3, attack: '🕸️' },
        { sprite: '👹', maxHp: 4, attack: '🔥' }
    ];
    let currentEnemyIdx = 0;
    let currentEnemyHp = 1;
    let allEnemiesCleared = false; 

    // 拼音解析系統
    let parsedAnswer = []; let inputBoxes = []; let currentSyllableIndex = 0; let typedBase = "";    
    const validLetters = ['a','b','c','e','g','h','i','j','k','l','m','n','o','p','s','t','u'];
    const toneDigits = ['1','2','3','4','5','7','8','9'];
    
    // ==== 手工繪製的 SVG + CSS 無破綻聲調系統 ====
    const svgCircle = `<svg class="tone-svg" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="2.5,2" /></svg>`;
    
    function getToneHtml(markStr, isTone8 = false) {
        let markHtml = isTone8 ? `<div class="mark-8"></div>` : markStr;
        return `<div class="custom-tone"><div class="c-mark">${markHtml}</div>${svgCircle}</div>`;
    }

    // 將入聲改為 2x2 的網格排列
    const ptkhGridHtml = `
        <div class="checked-tone-grid">
            <span>p</span><span>t</span>
            <span>k</span><span>h</span>
        </div>`;
    const subTone4 = `<div class="checked-tone-group">${getToneHtml('')}${ptkhGridHtml}</div>`;
    const subTone8 = `<div class="checked-tone-group">${getToneHtml('', true)}${ptkhGridHtml}</div>`;

    const lessonsDiv = document.getElementById('lessons');
    lessons.forEach(l => {
        const btn = document.createElement('button');
        btn.className = 'lesson-btn';
        btn.innerText = l;
        btn.onclick = () => {
            btn.classList.toggle('active');
            if(selectedLessons.includes(l)) selectedLessons = selectedLessons.filter(x => x !== l);
            else selectedLessons.push(l);
        };
        lessonsDiv.appendChild(btn);
    });

    // ==== 長按跳過機制 ====
    let skipTimer = null;
    let isPressingSkip = false;

    function startSkip() {
        if (isPressingSkip || hearts <= 0) return;
        isPressingSkip = true;
        const btn = document.querySelector('.key-skip');
        if (btn) btn.classList.add('pressing');
        
        skipTimer = setTimeout(() => {
            isPressingSkip = false;
            if (btn) btn.classList.remove('pressing');
            handleSkip(); 
        }, 2500);
    }

    function cancelSkip() {
        if (!isPressingSkip) return;
        isPressingSkip = false;
        clearTimeout(skipTimer);
        const btn = document.querySelector('.key-skip');
        if (btn) btn.classList.remove('pressing');
    }

    // ==== 動態鍵盤生成 ====
    function createKeyDiv(keyObj) {
        let val = typeof keyObj === 'string' ? keyObj : keyObj.val;
        let display = typeof keyObj === 'string' ? keyObj.toUpperCase() : keyObj.display;
        let subText = typeof keyObj === 'object' ? keyObj.sub : null;
        let forceDisabled = typeof keyObj === 'object' && keyObj.disabled;
        let customClass = typeof keyObj === 'object' && keyObj.customClass ? keyObj.customClass : '';

        const btn = document.createElement('div');
        btn.className = `key ${customClass}`;
        btn.dataset.key = val;
        
        let html = '';
        if (toneDigits.includes(val)) {
            // 聲調按鍵：角標數字 + 中央大符號 (採用自製 HTML)
            html += `<div class="tone-num">${display}</div>`;
            html += `<div class="tone-symbol">${subText}</div>`;
        } else {
            // 一般按鍵：置中文字
            html = `<div>${display}</div>`;
            if(subText) html += `<div class="tone-sub">${subText}</div>`;
        }
        btn.innerHTML = html;

        if (!forceDisabled && (validLetters.includes(val) || toneDigits.includes(val) || ['Backspace', 'Enter', 'Skip'].includes(val))) {
            btn.classList.add('active-key');
            
            if (val === 'Skip') {
                btn.addEventListener('mousedown', (e) => { e.preventDefault(); startSkip(); });
                btn.addEventListener('touchstart', (e) => { e.preventDefault(); startSkip(); }, {passive: false});
                btn.addEventListener('mouseup', (e) => { e.preventDefault(); cancelSkip(); });
                btn.addEventListener('mouseleave', (e) => { e.preventDefault(); cancelSkip(); });
                btn.addEventListener('touchend', (e) => { e.preventDefault(); cancelSkip(); }, {passive: false});
            } else {
                btn.addEventListener('mousedown', (e) => { e.preventDefault(); handleInput(val); });
                btn.addEventListener('touchstart', (e) => { e.preventDefault(); handleInput(val); }, {passive: false});
            }
        } else {
            btn.classList.add('disabled-key');
        }
        return btn;
    }

    function buildKeyboard() {
        const kbContainer = document.getElementById('keyboard');
        kbContainer.innerHTML = '';

        const row0 = document.createElement('div');
        row0.className = 'kb-row';
        // 使用安全、跨平台支援極佳的基礎符號來代替結合字元
        const numKeys = [
            {val: '1', display: '1', sub: getToneHtml('')}, 
            {val: '2', display: '2', sub: getToneHtml('´')}, 
            {val: '3', display: '3', sub: getToneHtml('ˋ')},
            {val: '4', display: '4', sub: subTone4}, 
            {val: '5', display: '5', sub: getToneHtml('ˆ')}, 
            {val: '6', display: '6', sub: getToneHtml('✘'), disabled: true}, 
            {val: '7', display: '7', sub: getToneHtml('¯')}, 
            {val: '8', display: '8', sub: subTone8}, 
            {val: '9', display: '9', sub: getToneHtml('˝')},
            {val: 'Backspace', display: '刪', sub: '', customClass: 'key-delete'}
        ];
        numKeys.forEach(k => row0.appendChild(createKeyDiv(k)));
        kbContainer.appendChild(row0);

        const row1 = document.createElement('div');
        row1.className = 'kb-row';
        ['q','w','e','r','t','y','u','i','o','p'].forEach(k => row1.appendChild(createKeyDiv(k)));
        kbContainer.appendChild(row1);

        const wrapper23 = document.createElement('div');
        wrapper23.style.display = 'flex'; wrapper23.style.gap = '4px'; wrapper23.style.width = '100%';

        const leftCol = document.createElement('div'); leftCol.style.flex = '1.3';
        leftCol.appendChild(createKeyDiv({val: 'Skip', display: '扣血<br>前進', customClass: 'key-tall key-skip'}));
        wrapper23.appendChild(leftCol);

        const midCol = document.createElement('div');
        midCol.style.flex = '7.4'; midCol.style.display = 'flex'; midCol.style.flexDirection = 'column'; midCol.style.gap = '6px';
        const row2 = document.createElement('div'); row2.className = 'kb-row';
        ['a','s','d','f','g','h','j','k','l'].forEach(k => row2.appendChild(createKeyDiv(k)));
        const row3 = document.createElement('div'); row3.className = 'kb-row';
        ['z','x','c','v','b','n','m'].forEach(k => row3.appendChild(createKeyDiv(k)));
        midCol.appendChild(row2); midCol.appendChild(row3);
        wrapper23.appendChild(midCol);

        const rightCol = document.createElement('div'); rightCol.style.flex = '1.3';
        rightCol.appendChild(createKeyDiv({val: 'Enter', display: '送出', customClass: 'key-tall key-enter'}));
        wrapper23.appendChild(rightCol);

        kbContainer.appendChild(wrapper23);
    }

    async function startGame() {
        if(selectedLessons.length === 0) return alert("請至少選擇一課！");
        isHintEnabled = document.getElementById('hint-toggle').checked;
        document.getElementById('menu').style.display = 'none';
        document.getElementById('game-screen').style.display = 'flex';
        
        buildKeyboard();
        document.getElementById('hanzi-hint').innerText = "載入中...";

        const fetchPromises = selectedLessons.map(sheet => 
            fetch(`https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${sheet}`).then(res => res.text())
        );

        const results = await Promise.all(fetchPromises);
        questionBank = [];
        results.forEach(text => {
            text.split(/\r?\n/).forEach(l => {
                const p = l.replace(/"/g, '').replace(/，/g, ',').split(',');
                if(p.length >= 2 && p[0].trim() !== "" && p[1].trim() !== "") {
                    questionBank.push({ h: p[0].trim(), r: p[1].trim() });
                }
            });
        });

        questionBank.sort(() => Math.random() - 0.5);
        
        // 重置狀態
        score = 0; hearts = 3; currentQuestionIndex = 0; maxQuestions = 14; 
        streakCount = 0; 
        
        // 重置敵人
        currentEnemyIdx = 0;
        currentEnemyHp = enemyConfig[0].maxHp;
        allEnemiesCleared = false;
        document.getElementById('enemy-sprite').innerText = enemyConfig[0].sprite;
        document.getElementById('enemy-sprite').classList.remove('enemy-dead');
        updateEnemyHpUI();

        updateHearts();
        loadQuestion();
    }

    function updateEnemyHpUI() {
        const hpDiv = document.getElementById('enemy-hp-ui');
        if (allEnemiesCleared) {
            hpDiv.innerText = "💀";
            return;
        }
        const max = enemyConfig[currentEnemyIdx].maxHp;
        const hp = currentEnemyHp;
        hpDiv.innerText = '🔴'.repeat(hp) + '⚫'.repeat(max - hp);
    }

    function parseTaiLoAnswer(rawText) {
        let text = rawText.split('(')[0].toLowerCase().trim();
        let rawSyllables = text.split(/[\s\-–—]+/).filter(s => s.length > 0);
        const toneMap = { '\u0301': '2', '\u0300': '3', '\u0302': '5', '\u0304': '7', '\u030D': '8', '\u030B': '9' };
        let parsed = [];
        for (let s of rawSyllables) {
            let nfd = s.normalize("NFD"); let base = ""; let tone = null;
            for (let char of nfd) {
                if (toneMap[char]) tone = toneMap[char];
                else if (/[a-z]/.test(char)) base += char;
            }
            if (!tone) tone = /[ptkh]$/.test(base) ? '4' : '1';
            parsed.push({ base: base, tone: tone });
        }
        return parsed; 
    }

    function applyToneToSyllable(syllable, toneDigit) {
        if (toneDigit === '1' || toneDigit === '4') return syllable;
        const marks = { '2': '\u0301', '3': '\u0300', '5': '\u0302', '7': '\u0304', '8': '\u030D', '9': '\u030B' };
        const m = marks[toneDigit];
        if (!m) return syllable;

        let res = syllable;
        if (res.includes('a')) res = res.replace('a', 'a' + m);
        else if (res.includes('oo')) res = res.replace('oo', 'o' + m + 'o');
        else if (res.includes('o') && !res.includes('oa') && !res.includes('oe')) res = res.replace('o', 'o' + m);
        else if (res.includes('e')) res = res.replace('e', 'e' + m);
        else if (res.includes('iu')) res = res.replace('iu', 'i' + 'u' + m);
        else if (res.includes('ui')) res = res.replace('ui', 'u' + 'i' + m);
        else if (res.includes('i')) res = res.replace('i', 'i' + m);
        else if (res.includes('u')) res = res.replace('u', 'u' + m);
        else if (res.includes('ng')) res = res.replace('ng', 'n' + m + 'g');
        else if (res.includes('m')) res = res.replace('m', 'm' + m);
        
        return res.normalize('NFC'); // 將組合字元轉換為標準獨立字元，避免輸入框破圖
    }

    function loadQuestion() {
        if (currentQuestionIndex >= Math.min(questionBank.length, maxQuestions) || hearts <= 0) {
            endGame(); return;
        }
        attempt = 1; stopTimer();
        
        const currentQ = questionBank[currentQuestionIndex];
        document.getElementById('hanzi-hint').innerText = isHintEnabled ? currentQ.h : "???";
        document.getElementById('progress-display').innerText = `進度: ${currentQuestionIndex + 1} / ${maxQuestions}`;
        
        parsedAnswer = parseTaiLoAnswer(currentQ.r);
        resetInputBoxes();
        playAudio();
    }

    function playAudio() { console.log("現在播放:", questionBank[currentQuestionIndex].h); }

    function resetInputBoxes() {
        inputBoxes = new Array(parsedAnswer.length).fill(null);
        currentSyllableIndex = 0; typedBase = ""; updateDisplay();
    }

    function handleInput(key) {
        if (key === 'Skip') return; // 點擊無效，必須長按
        
        if (key === 'Backspace') {
            if (typedBase.length > 0) {
                let chars = Array.from(typedBase); chars.pop(); typedBase = chars.join('');
            } else if (currentSyllableIndex > 0) {
                currentSyllableIndex--;
                typedBase = inputBoxes[currentSyllableIndex].base;
                inputBoxes[currentSyllableIndex] = null;
            }
        } 
        else if (key === 'Enter') {
            if (currentSyllableIndex === parsedAnswer.length) checkAnswer();
        } 
        else if (toneDigits.includes(key)) {
            if (typedBase.length > 0 && currentSyllableIndex < parsedAnswer.length) {
                inputBoxes[currentSyllableIndex] = { base: typedBase, tone: key };
                currentSyllableIndex++; typedBase = "";
            }
        } 
        else if (validLetters.includes(key)) {
            if (currentSyllableIndex < parsedAnswer.length) typedBase += key;
        }
        updateDisplay(); triggerVisualFeedback(key);
    }

    function updateDisplay() {
        document.getElementById('score-display').innerText = `分數: ${score}`;
        const container = document.getElementById('syllable-boxes-container');
        container.innerHTML = ''; 

        for (let i = 0; i < parsedAnswer.length; i++) {
            const box = document.createElement('div'); box.className = 'syllable-box';
            if (i < currentSyllableIndex) {
                box.innerText = applyToneToSyllable(inputBoxes[i].base, inputBoxes[i].tone);
            } else if (i === currentSyllableIndex) {
                box.classList.add('active-box');
                box.innerHTML = `<span>${typedBase}</span><span class="cursor"></span>`;
            } else { box.innerText = ''; }
            container.appendChild(box);
        }
    }

    function checkAnswer() {
        let isCorrect = true;
        for (let i = 0; i < parsedAnswer.length; i++) {
            if (inputBoxes[i].base !== parsedAnswer[i].base || inputBoxes[i].tone !== parsedAnswer[i].tone) {
                isCorrect = false; break;
            }
        }
        if (isCorrect) handleSuccess(); else handleFail();
    }

    function spawnEffect(type) {
        const arena = document.getElementById('rpg-arena');
        const effect = document.createElement('div');
        effect.className = 'combat-effect';
        
        if (type === 'sword') {
            effect.innerText = '🗡️';
            effect.style.left = '70px'; effect.style.bottom = '10px';
            effect.style.animation = 'swordSlash 0.3s ease-out forwards';
        } else if (type === 'enemyAttack') {
            effect.innerText = allEnemiesCleared ? '🦴' : enemyConfig[currentEnemyIdx].attack;
            effect.style.right = '70px'; effect.style.bottom = '10px';
            effect.style.animation = 'projFly 0.5s ease-out forwards';
        }
        arena.appendChild(effect);
        setTimeout(() => { effect.remove(); }, 500);
    }

    function handleSuccess() {
        stopTimer();
        streakCount++;
        if (streakCount > 0 && streakCount % 2 === 0 && maxQuestions < 21) { maxQuestions++; }
        
        const player = document.getElementById('player-sprite');
        const enemyEl = document.getElementById('enemy-sprite');
        
        player.classList.add('player-attack');
        spawnEffect('sword');
        
        let extraScore = 0;
        
        setTimeout(() => { 
            player.classList.remove('player-attack'); 
            
            if (allEnemiesCleared) {
                spawnCoin();
                extraScore = 10;
            } else {
                currentEnemyHp--;
                updateEnemyHpUI();
                if (currentEnemyHp <= 0) {
                    enemyEl.classList.add('enemy-dead');
                    spawnCoin();
                    extraScore = 10;
                    
                    setTimeout(() => {
                        if (currentEnemyIdx < 3) {
                            currentEnemyIdx++;
                            currentEnemyHp = enemyConfig[currentEnemyIdx].maxHp;
                            enemyEl.innerText = enemyConfig[currentEnemyIdx].sprite;
                            enemyEl.classList.remove('enemy-dead');
                            updateEnemyHpUI();
                        } else {
                            allEnemiesCleared = true;
                            updateEnemyHpUI();
                        }
                    }, 700);
                } else {
                    enemyEl.classList.add('enemy-hit-flash');
                    setTimeout(() => enemyEl.classList.remove('enemy-hit-flash'), 400);
                }
            }
            
            score += (isHintEnabled ? 10 : 20) + extraScore;
            updateDisplay();
        }, 150);
        
        setTimeout(() => { currentQuestionIndex++; loadQuestion(); }, 900);
    }

    function handleFail() {
        stopTimer();
        streakCount = 0; 
        
        const container = document.getElementById('syllable-boxes-container');
        container.classList.add('shake', 'error-shake');
        setTimeout(() => { container.classList.remove('shake', 'error-shake'); }, 400);
        
        const player = document.getElementById('player-sprite');
        const enemy = document.getElementById('enemy-sprite');

        if (attempt === 1 || attempt === 2) {
            if (!allEnemiesCleared) {
                enemy.classList.add('enemy-attack');
                setTimeout(() => { enemy.classList.remove('enemy-attack'); }, 400);
            }
            spawnEffect('enemyAttack');
            
            setTimeout(() => { player.classList.add('player-dodge'); }, 150); 
            setTimeout(() => { player.classList.remove('player-dodge'); }, 600); 
            
            let nextTime = (attempt === 1) ? 15 : 10;
            attempt++; resetInputBoxes(); startTimer(nextTime);
        } else {
            takeDamage();
        }
    }

    function handleSkip() {
        if (hearts <= 0) return; 
        stopTimer(); streakCount = 0; 
        const container = document.getElementById('syllable-boxes-container');
        container.classList.add('shake', 'error-shake');
        setTimeout(() => { container.classList.remove('shake', 'error-shake'); }, 400);
        
        takeDamage();
    }

    function takeDamage() {
        const player = document.getElementById('player-sprite');
        const enemy = document.getElementById('enemy-sprite');
        
        if (!allEnemiesCleared) {
            enemy.classList.add('enemy-attack');
            setTimeout(() => { enemy.classList.remove('enemy-attack'); }, 400);
        }
        spawnEffect('enemyAttack');
        
        setTimeout(() => { player.classList.add('player-hit'); }, 200); 
        setTimeout(() => { player.classList.remove('player-hit'); }, 700); 
        
        hearts--; updateHearts();
        setTimeout(() => {
            if (hearts <= 0) endGame(); else { currentQuestionIndex++; loadQuestion(); }
        }, 1000);
    }

    function startTimer(seconds) {
        const container = document.getElementById('timer-container');
        const bar = document.getElementById('timer-bar');
        const text = document.getElementById('timer-text');
        
        container.style.display = 'block'; timeLeft = seconds;
        bar.style.transition = 'none'; bar.style.width = '100%'; bar.style.background = (seconds === 15) ? '#ff9800' : '#f44336';
        text.innerText = timeLeft + "秒";
        
        bar.offsetHeight; bar.style.transition = 'width 1s linear';
        
        timer = setInterval(() => {
            timeLeft--;
            bar.style.width = `${(timeLeft / seconds) * 100}%`;
            text.innerText = timeLeft + "秒";
            if (timeLeft <= 0) { stopTimer(); handleFail(); }
        }, 1000);
    }

    function stopTimer() {
        clearInterval(timer); document.getElementById('timer-container').style.display = 'none';
    }

    function updateHearts() {
        let hStr = "";
        for(let i=0; i<3; i++) hStr += (i < hearts) ? "❤️" : "🖤";
        document.getElementById('health-bar').innerText = hStr;
    }

    function spawnCoin() {
        const arena = document.getElementById('rpg-arena');
        const coin = document.createElement('div');
        coin.className = 'coin'; coin.innerText = '🪙';
        coin.style.right = '40px'; arena.appendChild(coin);
        setTimeout(() => { coin.remove(); }, 1000);
    }

    function triggerVisualFeedback(key) {
        const btn = document.querySelector(`.key[data-key="${key}"]`);
        if(btn && !btn.classList.contains('disabled-key')) {
            btn.style.background = '#00e5ff'; btn.style.color = '#000';
            setTimeout(() => { btn.style.background = ''; btn.style.color = ''; }, 100);
        }
    }

    // 實體鍵盤綁定：增加 Ctrl 長按偵測
    window.addEventListener('keydown', e => {
        if(document.getElementById('game-screen').style.display === 'flex') {
            if (e.key === 'Control') {
                if (!e.repeat) startSkip();
                return;
            }
            const k = e.key.toLowerCase();
            if (k === 'enter') handleInput('Enter');
            else if (k === 'backspace') handleInput('Backspace');
            else handleInput(k);
        }
    });

    window.addEventListener('keyup', e => {
        if(document.getElementById('game-screen').style.display === 'flex') {
            if (e.key === 'Control') { cancelSkip(); }
        }
    });

    function endGame() {
        stopTimer();
        document.getElementById('game-screen').style.display = 'none';
        document.getElementById('game-over').style.display = 'flex';
        document.getElementById('final-score').innerText = score;
        
        let endComment = ""; let commentColor = "";
        if (score >= 300) { endComment = "拍倒惡鬼，光榮倒轉來！"; commentColor = "#4caf50"; } 
        else if (score >= 150) { endComment = "Hiàm出惡鬼，繼續修行！"; commentColor = "#ff9800"; } 
        else { endComment = "惡鬼koh teh作孽，毋通放棄！"; commentColor = "#f44336"; }
        
        const commentDiv = document.getElementById('end-comment');
        commentDiv.innerText = endComment; commentDiv.style.color = commentColor;
    }
</script>
