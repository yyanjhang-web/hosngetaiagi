<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我喜歡你 - 影片連結</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
        }
        .btn-container {
            display: flex;
            gap: 20px;
        }
        .btn {
            display: inline-block;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            color: white;
            border-radius: 8px;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 3px rgba(0,0,0,0.1);
        }
        .btn-youtube {
            background-color: #ff0000;
        }
        .btn-youtube:hover {
            background-color: #cc0000;
        }
        .btn-local {
            background-color: #007bff;
        }
        .btn-local:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h1>請選擇觀看版本</h1>

    <div class="btn-container">
        <!-- 第一個按鈕：導向 YouTube (另開新分頁) -->
        <a href="https://www.youtube.com/watch?v=Q-Y-C_S5HFY" target="_blank" class="btn btn-youtube">我喜歡你_芒果醬</a>

        <!-- 第二個按鈕：導向內部的 mp4 檔案 (路徑對應你的 github 資料夾) -->
        <a href="./woxihuani/我喜歡你_羅馬字歌詞版.mp4" class="btn btn-local">羅馬字歌詞</a>
    </div>

</body>
</html>
